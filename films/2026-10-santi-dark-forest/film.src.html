<!doctype html>
<html><head><meta charset="utf-8"><title>黑暗森林</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas width="1920" height="1080"></canvas>
<script>
// 黑暗森林: the droplet's Doomsday Battle and the Singer's dual-vector foil, cut to "Interstellar Space Travel".
// Frame contract: window.DURATION (seconds) and async window.seek(t); every value is a pure function of t.
// Static tables (stars, ships, line art) are built once from seeded generators and never mutated.
const TL = JSON.parse(__TEXT:timeline.json__), CUE = TL.cue, SC = TL.scenes;
const W = 1920, H = 1080, DURATION = TL.duration;
const INK = '#e8ecf4', GOLD = '#ffcf7a', ICE = '#bcd3ff', SPACE = '#04060b';
const ZH = '"Songti SC", "STSong", serif';
const cv = document.querySelector('canvas'), ctx = cv.getContext('2d');

// ---- time helpers --------------------------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x * x * (3 - 2 * x);
const easeIO = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const window01 = (t, a, b, fin = 0.4, fout = 0.4) => ease(ramp(t, a, a + fin)) * (1 - ease(ramp(t, b - fout, b)));
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
function rng(seed) {                                   // mulberry32: the same seed gives the same table every load
  return () => { seed = (seed + 0x6D2B79F5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
}

// ---- type ----------------------------------------------------------------------------------------------
function text(s, x, y, { size = 34, weight = 400, font = ZH, color = INK, alpha = 1, track = 0, align = 'center', blur = 0, glow = null } = {}) {
  if (alpha <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = `${track}em`;
  if (blur || glow) { ctx.shadowColor = glow || 'rgba(0,0,0,0.85)'; ctx.shadowBlur = blur || 24; }
  // letterSpacing adds space after the last glyph too; shift centred text back by half of it
  ctx.fillText(s, x + (align === 'center' ? track * size / 2 : 0), y);
  ctx.restore();
}

// ---- sky -----------------------------------------------------------------------------------------------
const STARS = (() => {
  const r = rng(7), tint = ['#9fb4ff', '#cfd8ff', '#ffffff'];
  return Array.from({ length: 2400 }, (_, i) => ({ x: r() * (W + 200), y: r() * H, layer: i % 3,
    s: [0.55, 0.9, 1.5][i % 3] * (0.6 + 0.8 * r()), ph: r() * TAU, f: 0.6 + 2.4 * r(), c: tint[(r() * 3) | 0] }));
})();
const DRIFT = [2, 5, 11];                              // px/s per depth layer: a slow pan the whole film long
function stars(t, a = 1) {
  if (a <= 0.001) return;
  ctx.save();
  for (const s of STARS) {
    const x = ((s.x - t * DRIFT[s.layer]) % (W + 200) + W + 200) % (W + 200) - 100;
    const k = a * (0.75 + 0.25 * Math.sin(t * s.f + s.ph)) * (0.45 + 0.25 * s.layer);
    ctx.globalAlpha = k; ctx.fillStyle = s.c;
    if (s.s < 1.1) ctx.fillRect(x, s.y, s.s, s.s);
    else { ctx.beginPath(); ctx.arc(x, s.y, s.s * 0.6, 0, TAU); ctx.fill(); }
  }
  ctx.restore();
}
function backdrop() {
  ctx.fillStyle = SPACE; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W * 0.55, H * 0.45, 0, W * 0.55, H * 0.45, W * 0.75);
  g.addColorStop(0, 'rgba(14,24,44,0.9)'); g.addColorStop(1, 'rgba(4,6,11,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function vignette(strength) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${strength})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
const GRAIN = (() => {                                 // seeded noise tile; moved every 1/24 s it reads as film grain and dithers gradients
  const c = Object.assign(document.createElement('canvas'), { width: 256, height: 256 }), g = c.getContext('2d'), d = g.createImageData(256, 256);
  let s = 20261031;
  for (let i = 0; i < d.data.length; i += 4) { s = (s * 1664525 + 1013904223) >>> 0; const v = s >>> 24; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
})();
function grain(t) {
  const f = Math.floor(t * 24), ox = (f * 97) % 256, oy = (f * 61) % 256;
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.07;
  ctx.translate(-ox, -oy); ctx.fillStyle = ctx.createPattern(GRAIN, 'repeat'); ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
}

// ---- glow sprites (drawn additively; built once) ---------------------------------------------------------
function sprite(rgb, size = 64) {
  const c = Object.assign(document.createElement('canvas'), { width: size, height: size }), g = c.getContext('2d');
  const r = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  r.addColorStop(0, `rgba(${rgb},1)`); r.addColorStop(0.25, `rgba(${rgb},0.45)`); r.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = r; g.fillRect(0, 0, size, size); return c;
}
const GLOW = { gold: sprite('255,200,120'), white: sprite('255,248,235'), ember: sprite('255,110,40'), ice: sprite('170,215,255') };
function glow(img, x, y, d, a) { if (a > 0.003 && d > 0.5) { ctx.globalAlpha = Math.min(1, a); ctx.drawImage(img, x - d / 2, y - d / 2, d, d); } }

// ---- the cold open: the forest, and a few eyes in it ----------------------------------------------------
const EYES = [[420, 300, 3.2], [1510, 210, 5.4], [1180, 760, 7.6], [260, 820, 9.0]];   // x, y, when it opens
function drawOpen(t) {
  if (t > SC.fleet + 1) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, at] of EYES) {
    const a = window01(t, at, at + 2.6, 0.5, 1.6) * (1 - ramp(t, SC.fleet - 0.4, SC.fleet));
    glow(GLOW.ice, x, y, 46, 0.55 * a); glow(GLOW.white, x, y, 8, 0.9 * a);
  }
  ctx.restore();
}

// ---- the Doomsday Battle: 2,016 ships, one droplet ------------------------------------------------------
// World: x right, y up, z away from the camera; the fleet is a flat slab of COLS x ROWS ships, SP apart.
// The droplet makes four passes, one per accent in the music, each straight down the middle of one band of
// columns, so every strike is a line of explosions running from the camera to the horizon (or back); a ship
// dies when the pass reaches it, plus the time the chain of explosions takes to spread sideways to it.
// About 1% never die: they run.
const COLS = 48, ROWS = 42, SP = 60, F = 1200, PASS = 0.7, CHAIN = 330, Z0 = -500, Z1 = (ROWS - 1) * SP + 500;
const ORDER = [1, 2, 0, 3];                            // the band each strike cuts: centre-left, centre-right, left, right
const bandOf = col => Math.floor(col / (COLS / 4));
const BANDX = ORDER.map(b => ((b + 0.5) * COLS / 4 - 0.5 - (COLS - 1) / 2) * SP);
const passZ = (k, u) => (k % 2 ? lerp(Z0, Z1, u) : lerp(Z1, Z0, u));         // even strikes come at the camera, odd ones go away
const SHIPS = (() => {
  const r = rng(11), out = [];
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    const s = { x: (i - (COLS - 1) / 2) * SP + (r() - 0.5) * 12, y: (r() - 0.5) * 16, z: j * SP + (r() - 0.5) * 12, row: j,
      run: r() < 0.012, dir: r() * TAU, jit: r() * 0.15, deb: [0, 1, 2].map(() => [r() * TAU, 40 + 90 * r(), (r() - 0.5) * 60]) };
    const k = ORDER.indexOf(bandOf(i)), u = (s.z - passZ(k, 0)) / (passZ(k, 1) - passZ(k, 0));
    s.tk = s.run ? Infinity : CUE.kills[k] + PASS * clamp(u) + Math.abs(s.x - BANDX[k]) / CHAIN + s.jit;
    out.push(s);
  }
  return out;
})();

function camAt(t) {                                    // low over the slab: dolly in on the reveal, settle and drift through the battle
  const a = easeIO(ramp(t, SC.fleet, SC.drop)), b = ease(ramp(t, CUE.kills[0], SC.foil));
  const c = { x: lerp(-120, 260, b), y: lerp(620, 380, a) - 40 * b, z: lerp(-2600, -1250, a) + lerp(0, 220, b),
              roll: 0.05 * Math.sin(t * 0.11) - 0.05 * a, cy: lerp(H * 0.62, H * 0.5, a) };   // cy: the slab sits low under the title
  c.pitch = Math.atan2(c.y, 1500 - c.z);
  return c;
}
function project(c, X, Y, Z) {
  const dx = X - c.x, dy = Y - c.y, dz = Z - c.z, cp = Math.cos(c.pitch), sp = Math.sin(c.pitch);
  const y1 = dy * cp + dz * sp, z1 = -dy * sp + dz * cp;
  if (z1 < 60) return null;
  const s = F / z1, sx = dx * s, sy = -y1 * s, cr = Math.cos(c.roll), sr = Math.sin(c.roll);
  return [W / 2 + sx * cr - sy * sr, c.cy + sx * sr + sy * cr, s, z1];
}
function dropletAt(t) {                                // world position of the droplet in the wide shot (after the close-up)
  const K = CUE.kills;
  for (let k = 0; k < 4; k++) {
    if (t < K[k] + PASS) return [BANDX[k], 0, passZ(k, ramp(t, K[k], K[k] + PASS))];
    const next = K[k + 1] ?? SC.ember;
    if (t < next) {                                    // between passes: loop out past the end of the slab, then line up the next cut
      const u = easeIO(ramp(t, K[k] + PASS, next)), z0 = passZ(k, 1), out = z0 > 0 ? 1 : -1;
      if (k === 3) return [BANDX[3] + 2000 * u * u, 900 * u * u, z0 + 14000 * u * u];   // and away, over the horizon
      const x0 = BANDX[k], x1 = BANDX[k + 1], mz = z0 + out * 1100, q = 1 - u;
      return [q * x0 + u * x1, 260 * Math.sin(Math.PI * u), q * q * z0 + 2 * q * u * mz + u * u * z0];
    }
  }
  return null;
}

function drawDropletClose(t) {                         // the close-up: a perfect mirror with the fleet's lights in it
  const a = window01(t, SC.drop, CUE.kills[0], 0.25, 0.05);
  if (a <= 0) return;
  const g = easeIO(ramp(t, SC.drop, SC.drop + 3.2)), sc = lerp(0.16, 1, g) * lerp(1, 1.06, ramp(t, SC.drop + 3.2, CUE.kills[0]));
  const cx = lerp(W * 0.72, W * 0.5, g), cy = lerp(H * 0.36, H * 0.48, g), R = 150 * sc, L = 470 * sc, rot = -0.18 + 0.05 * Math.sin(t * 0.7);
  ctx.save(); ctx.globalAlpha = a; ctx.translate(cx, cy); ctx.rotate(rot);
  const shape = () => { ctx.beginPath(); ctx.moveTo(-L, 0);           // pointed tail to the left, round head to the right
    ctx.bezierCurveTo(-L * 0.45, -R * 0.2, -R * 0.6, -R, R * 0.15, -R);
    ctx.bezierCurveTo(R * 1.35, -R, R * 1.35, R, R * 0.15, R);
    ctx.bezierCurveTo(-R * 0.6, R, -L * 0.45, R * 0.2, -L, 0); ctx.closePath(); };
  shape(); ctx.save(); ctx.clip();
  const body = ctx.createLinearGradient(0, -R, 0, R);
  body.addColorStop(0, '#dfe8f2'); body.addColorStop(0.18, '#7d8ea3'); body.addColorStop(0.5, '#0d131c'); body.addColorStop(0.82, '#3a4a5e'); body.addColorStop(1, '#c9d6e4');
  ctx.fillStyle = body; ctx.fillRect(-L, -R, L + R * 1.4, 2 * R);
  ctx.globalCompositeOperation = 'lighter';            // the fleet, curved across the mirror and sliding as it turns
  for (let j = 0; j < 14; j++) for (let i = 0; i < 30; i++) {
    const u = (i / 29) * 2 - 1 + 0.08 * Math.sin(t * 0.4), v = 0.18 + j * 0.035;
    const x = R * 0.2 + (L * 0.75) * u * (1 - 0.32 * u * u) - L * 0.18, y = R * v * (1 - 0.25 * u * u);
    glow(GLOW.gold, x, y, 12 * sc + 2, 0.95 * (1 - Math.abs(u)) * (0.6 + 0.4 * Math.sin(i * 1.7 + j)));
  }
  const spec = ctx.createLinearGradient(0, -R * 0.95, 0, -R * 0.55);    // the hard specular band that tells you it is a mirror
  spec.addColorStop(0, 'rgba(255,255,255,0)'); spec.addColorStop(0.5, 'rgba(255,255,255,0.85)'); spec.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.globalAlpha = a; ctx.fillStyle = spec; ctx.fillRect(-L * 0.3, -R, L * 0.3 + R * 1.2, R * 0.5);
  ctx.restore();
  ctx.globalCompositeOperation = 'lighter'; ctx.lineWidth = 1.2; ctx.strokeStyle = `rgba(200,225,255,${0.5 * a})`; shape(); ctx.stroke();
  const wake = ramp(t, CUE.kills[0] - 0.45, CUE.kills[0]);         // it wakes: a glint runs along the rim just before it strikes
  if (wake > 0) glow(GLOW.white, lerp(-L, R * 1.1, wake), -R * 0.62 * Math.sin(Math.PI * wake), 160 * sc, wake);
  ctx.restore();
}

function drawFleet(t) {                               // fleet, drop, ember: the Doomsday Battle
  drawOpen(t);
  if (t < SC.fleet - 0.05 || t > SC.foil + 1) return;
  if (t >= SC.drop && t < CUE.kills[0]) { drawDropletClose(t); return; }
  const c = camAt(t);
  const crane = easeIO(ramp(t, SC.ember + 10, SC.foil - 4));       // up and away until the battlefield is a speck by the Sun
  const C0 = project(c, 0, 0, (ROWS - 1) * SP / 2) || [W / 2, H / 2];
  const fade = 1 - ramp(t, SC.foil - 4, SC.foil + 1);
  ctx.save();
  ctx.translate(lerp(C0[0], edgeAt(t)[0] + 14, crane), lerp(C0[1], edgeAt(t)[1] - 8, crane)); ctx.scale(lerp(1, 0.012, crane), lerp(1, 0.012, crane)); ctx.translate(-C0[0], -C0[1]);
  ctx.globalCompositeOperation = 'lighter';
  for (const s of SHIPS) {
    let X = s.x, Y = s.y, Z = s.z;
    if (s.run) { const u = Math.max(0, t - CUE.kills[1]); X += Math.sign(s.x || 1) * 70 * u * u; Z += 160 * u * u; Y += 14 * u * u; }   // away from the camera
    const p = project(c, X, Y, Z); if (!p) continue;
    const [x, y, k, z1] = p, haze = clamp(1.3 - z1 / 4200, 0.25, 1);
    const on = ease(ramp(t, SC.fleet + s.row * 0.022, SC.fleet + s.row * 0.022 + 0.35)) * fade * haze;
    const dt = t - s.tk;
    if (dt < 0) {                                      // alive: a dark hull lit by its own drive
      const pulse = 0.85 + 0.15 * Math.sin(t * 2 + s.dir * 5);
      ctx.globalAlpha = 0.75 * on; ctx.fillStyle = '#c9a265'; ctx.fillRect(x - 16 * k, y - Math.max(0.5, 2.2 * k), 32 * k, Math.max(1, 4.4 * k));
      glow(GLOW.gold, x + 16 * k, y, 46 * k + 3, 0.7 * on * pulse);
      glow(GLOW.white, x + 16 * k, y, 9 * k + 1.5, 0.9 * on);
      if (s.run && t > CUE.kills[1]) glow(GLOW.white, x, y, 22 * k + 4, 0.9 * fade);
    } else {                                           // dead: a short hard flash, a dying ember, sparks flung out
      glow(GLOW.white, x, y, 120 * k * Math.exp(-dt / 0.25) + 3, 1.1 * Math.exp(-dt / 0.07) * haze);
      const smoulder = (0.32 * Math.exp(-dt / 1.6) + 0.16 * Math.exp(-dt / 16)) * (0.5 + s.jit * 3.3) * fade * haze;
      ctx.globalAlpha = 0.5 * Math.exp(-dt / 18) * fade * haze; ctx.fillStyle = '#6a2c16';   // the wreck, still glowing dull red
      ctx.fillRect(x - 14 * k, y - Math.max(0.5, 2 * k), 28 * k, Math.max(1, 4 * k));
      glow(GLOW.ember, x, y, 30 * k + 2, smoulder);
      for (const [d, v, vy] of s.deb) {                // sparks fly out fast, then keep drifting
        const e = 1 - Math.exp(-dt / 1.5) + dt * 0.02, q = project(c, X + Math.cos(d) * v * 1.5 * e, Y + vy * e, Z + Math.sin(d) * v * 1.5 * e);
        if (q) glow(GLOW.ember, q[0], q[1], 6 * q[2] + 1.2, (0.55 * Math.exp(-dt / 2) + 0.14 * Math.exp(-dt / 12)) * fade);
      }
    }
  }
  const P = t >= CUE.kills[0] ? dropletAt(t) : null;   // the droplet: a white-hot point with a cyan wake
  if (P) {
    const trail = [];
    for (let j = 0; j <= 16; j++) { const Q = dropletAt(t - j * 0.01), q = Q && project(c, ...Q); if (q) trail.push(q); }
    ctx.globalAlpha = 0.8; ctx.strokeStyle = '#bfe4ff'; ctx.lineCap = 'round';
    for (let j = 1; j < trail.length; j++) {          // a tapering cyan wake
      ctx.lineWidth = (5 * trail[0][2] + 1.5) * (1 - j / trail.length);
      ctx.beginPath(); ctx.moveTo(trail[j - 1][0], trail[j - 1][1]); ctx.lineTo(trail[j][0], trail[j][1]); ctx.stroke();
    }
    const q = project(c, ...P);
    if (q) { glow(GLOW.white, q[0], q[1], Math.min(56, 90 * q[2] + 14), 1); glow(GLOW.ice, q[0], q[1], Math.min(130, 220 * q[2] + 30), 0.7); }   // capped: up close it is a star, not a lens blob
  }
  ctx.restore();
  for (const k of CUE.kills) {                         // each strike lights the whole frame for an instant
    const a = t >= k ? 0.12 * Math.exp(-(t - k) / 0.25) : 0;
    if (a > 0.003) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,240,220,${a})`; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  }
}

// ---- the Singer: a glance, and a slip of paper ---------------------------------------------------------
// The Singer is never drawn, only its gaze: rings of cold sensing points rippling out from off-frame left.
// One bright ring, the glance, crosses the Sun as the narration says "瞥了一眼". On the 1:14 accent the foil
// flicks out and tumbles to the outer edge of the Solar System, where the fall begins.
const SUN = [1340, 560], ORBITS = [22, 30, 40, 52, 86, 120, 158, 196], EDGE = [SUN[0] - 214, SUN[1] + 28];   // Mercury to Neptune
const GAZE = [-700, 300], GLANCE = SC.ember + 8.9, GLANCE_V = 620;
const glanceHits = GLANCE + Math.hypot(SUN[0] - GAZE[0], SUN[1] - GAZE[1]) / GLANCE_V;
const ssZoom = t => lerp(1, 1.6, easeIO(ramp(t, SC.ember + 14, SC.fall + 4)));   // a slow push-in on the Solar System, into the fall
const edgeAt = t => [SUN[0] + (EDGE[0] - SUN[0]) * ssZoom(t), SUN[1] + (EDGE[1] - SUN[1]) * ssZoom(t)];
function solarSystem(t, a) {                          // the far view: the Sun and faint orbits (the fall takes over from here)
  if (a <= 0.001) return;
  const z = ssZoom(t);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 1.2; ctx.strokeStyle = `rgba(150,180,230,${0.24 * a})`;
  for (const r of ORBITS) { ctx.beginPath(); ctx.ellipse(SUN[0], SUN[1], r * z, r * z * 0.34, -0.12, 0, TAU); ctx.stroke(); }
  glow(GLOW.gold, SUN[0], SUN[1], 80 * z, 0.9 * a); glow(GLOW.white, SUN[0], SUN[1], 14 * z, a);
  const p = t - glanceHits;                            // noticed: a cold ring closes on the Sun
  if (p > -0.4 && p < 1.6) { ctx.strokeStyle = `rgba(190,225,255,${0.7 * a * window01(p, -0.4, 1.6, 0.3, 1)})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(SUN[0], SUN[1], lerp(70, 10, ease(ramp(p, -0.4, 1.2))), 0, TAU); ctx.stroke(); }
  ctx.restore();
}
const FLICK = [170, 640];
function foilAt(t) {                                  // the foil's path: a slow arc, under the quote card, to the Solar System's edge
  const u = easeIO(ramp(t, CUE.flick, SC.fall)), q = 1 - u, P1 = [700, 800], E = edgeAt(t);
  return [q * q * FLICK[0] + 2 * q * u * P1[0] + u * u * E[0], q * q * FLICK[1] + 2 * q * u * P1[1] + u * u * E[1], lerp(1.25, 0.3, u)];
}
function drawFoil(t) {
  if (t < CUE.flick - 0.05 || t > SC.fall + 1.5) return;
  const [x, y, s] = foilAt(t), a = 1 - ramp(t, SC.fall, SC.fall + 1.5);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  glow(GLOW.white, FLICK[0], FLICK[1], 180, 0.9 * Math.exp(-Math.max(0, t - CUE.flick) / 0.12));   // the flick
  for (let j = 1; j <= 24; j++) {                      // a faint glimmer behind it
    const [px, py] = foilAt(t - j * 0.05); glow(GLOW.ice, px, py, 10 * s + 2, 0.12 * a * (1 - j / 25));
  }
  glow(GLOW.ice, x, y, 70 * s + 8, 0.45 * a);
  const rot = (t - CUE.flick) * 2.1, fore = Math.abs(Math.cos(rot * 0.7)) * 0.85 + 0.15;   // tumbling: it flattens and turns
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(1, fore);
  ctx.globalAlpha = a; ctx.fillStyle = 'rgba(235,245,255,0.55)'; ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 1.2 / fore;
  const w = 28 * s, h = 18 * s; ctx.beginPath(); ctx.moveTo(-w / 2 + 5 * s, -h / 2); ctx.lineTo(w / 2 + 5 * s, -h / 2); ctx.lineTo(w / 2 - 5 * s, h / 2); ctx.lineTo(-w / 2 - 5 * s, h / 2); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawSinger(t) {                              // the Singer's gaze, the Sun it notices, and the foil
  if (t < SC.ember + 6 || t > SC.fall + 3) return;
  const a = ease(ramp(t, SC.ember + 6, SC.ember + 9)) * (1 - ease(ramp(t, SC.fall - 1, SC.fall + 3)));
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const drift = (t * 22) % 140, Rg = GLANCE_V * (t - GLANCE);

    if (ring <= 0.01) continue;
    for (let th = -0.62; th < 0.78; th += 20 / r) {
      const x = GAZE[0] + r * Math.cos(th), y = GAZE[1] + r * Math.sin(th);
      if (x < -10 || x > W + 10 || y < -10 || y > H + 10) continue;
      const g = t > GLANCE ? Math.exp(-(((r - Rg) / 70) ** 2)) * (1 - ramp(t, GLANCE + 3, GLANCE + 5)) : 0;
      glow(GLOW.ice, x, y, 8 + 10 * g, ring * (0.3 + 0.15 * Math.sin(th * 40 + i + t * 0.8) + 0.7 * g));

  ctx.restore();
  solarSystem(t, ease(ramp(t, SC.ember + 10, SC.ember + 14)) * (t < SC.fall ? 1 : 0));   // drawFall takes over on the same geometry
  drawFoil(t);
}

// ---- the fall: the Solar System collapses into two dimensions ---------------------------------------------
// Local coordinates are the orbital plane, the Sun at the origin, 1 unit = 1 px at zoom 1: the Singer's far view
// drawn the same way, so the hand-over is invisible. The foil touched down at IMPACT; from SC.fall a disc of
// two-dimensional space grows from there. A body flattens the moment the disc's edge reaches it, and each body
// sits on its orbit at the distance from IMPACT that the edge reaches on its cue: Neptune, Uranus, Saturn and
// Jupiter on CUE.planets, the Sun on CUE.sun, Earth (on the far side of the Sun) on CUE.earth.
const TILT = 0.34, ROT = -0.12;
const IMPACT = (() => { const dx = EDGE[0] - SUN[0], dy = EDGE[1] - SUN[1], c = Math.cos(-ROT), s = Math.sin(-ROT); return [dx * c - dy * s, (dx * s + dy * c) / TILT]; })();
const DSUN = Math.hypot(...IMPACT);
const RHO = [[SC.fall, 0], [CUE.planets[0], 40], [CUE.planets[1], 90], [CUE.planets[2], 135], [CUE.planets[3], 175],
             [CUE.sun, DSUN], [CUE.earth, 252], [SC.escape, 470]];
function keyed(t, keys, shape = x => x) {            // piecewise between [t, value] keys; shape eases each segment
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) {
    const [t0, a] = keys[i - 1], [t1, b] = keys[i], k = shape((t - t0) / (t1 - t0));
    return Array.isArray(a) ? a.map((v, j) => lerp(v, b[j], k)) : lerp(a, b, k);
  }
  return keys.at(-1)[1];
}
const rhoAt = t => keyed(t, RHO);
const hitOf = d => { for (let i = 1; i < RHO.length; i++) if (d <= RHO[i][1]) return lerp(RHO[i - 1][0], RHO[i][0], (d - RHO[i - 1][1]) / (RHO[i][1] - RHO[i - 1][1])); return Infinity; };
function guilloche(seed, rings) {                     // a unit-radius engraving: fine lace rings, a spirograph, fine circles
  const r = rng(seed), p = new Path2D(), N = 2400;     // high ring frequencies keep it fine even at the closest zoom
  for (let i = 0; i < rings; i++) {
    const a = 0.24 + 0.7 * (i + 1) / (rings + 1), b = 0.012 + 0.028 * r(), m = 36 + Math.floor(r() * 90), ph = r() * TAU;
    for (let j = 0; j <= N; j++) { const u = j / N * TAU, q = a + b * Math.cos(m * u + ph); j ? p.lineTo(q * Math.cos(u), q * Math.sin(u)) : p.moveTo(q * Math.cos(u), q * Math.sin(u)); }
  }
  const n = [7, 9, 11, 13][Math.floor(r() * 4)], l = 0.55 + 0.3 * r(), k = 1 / n, s = 0.98 / (1 - k + l * k);
  for (let j = 0; j <= 1400; j++) { const u = j / 1400 * TAU, x = (1 - k) * Math.cos(u) + l * k * Math.cos((1 - k) / k * u), y = (1 - k) * Math.sin(u) - l * k * Math.sin((1 - k) / k * u); j ? p.lineTo(x * s, y * s) : p.moveTo(x * s, y * s); }
  for (const c of [0.2, 0.62, 1]) { p.moveTo(c, 0); p.arc(0, 0, c, 0, TAU); }
  return p;
}
const BODIES = [                                      // r: orbit, d: distance from IMPACT, side: which way round the orbit, size: radius at zoom 1,
  { n: 'neptune', zh: '海王星', r: 196, d: 40, side: 1, size: 5.3, hue: 228, col: '#6a86ff' },   // spread: how far its 2D image sprawls
  { n: 'uranus', zh: '天王星', r: 158, d: 90, side: -1, size: 4.8, hue: 186, col: '#9fe6ea' },
  { n: 'saturn', zh: '土星', r: 120, d: 135, side: 1, size: 6.3, hue: 42, col: '#e6cd96', ring: true },
  { n: 'jupiter', zh: '木星', r: 86, d: 175, side: -1, size: 8.3, hue: 26, col: '#dcae80' },
  { n: 'mars', r: 52, d: 195, side: 1, size: 2.7, hue: 12, col: '#d4673f' },
  { n: 'venus', r: 30, d: 205, side: -1, size: 3.3, hue: 48, col: '#eadbb0' },
  { n: 'sun', zh: '太阳', r: 0, d: DSUN, size: 11, hue: 44, col: '#fff2cc', sun: true },
  { n: 'mercury', r: 22, d: 225, side: 1, size: 2.2, hue: 30, col: '#bdaea0' },
  { n: 'earth', zh: '地球', r: 40, d: 252, side: -1, size: 3.7, hue: 200, col: '#4f9be8', earth: true },
].map((b, i) => {
  const alpha = Math.atan2(IMPACT[1], IMPACT[0]);
  const th = b.r ? alpha + b.side * Math.acos(clamp((b.r * b.r + DSUN * DSUN - b.d * b.d) / (2 * b.r * DSUN), -1, 1)) : 0;
  return { ...b, x: b.r * Math.cos(th), y: b.r * Math.sin(th), hit: hitOf(b.d), path: guilloche(31 + i * 7, b.sun ? 10 : b.earth ? 13 : 6), ph: i * 1.3 };
});
const EARTH = BODIES.find(b => b.earth);
const GLYPHS = (() => { const r = rng(5); return Array.from({ length: 150 }, (_, i) => [i / 150 * TAU, 0.8 + 0.1 * r(), 0.015 + 0.06 * r() * r(), r() < 0.3]); })();
function fallView(t) {                                // where the plane sits: screen anchor P, local focus F, zoom z
  const z0 = ssZoom(SC.fall), E = [EARTH.x, EARTH.y];
  return keyed(t, [[SC.fall, [1340, 560, 0, 0, z0]], [100, [1080, 560, 0, 0, 2.3]], [CUE.sun, [1000, 560, 0, 0, 2.7]],
                   [CUE.earth + 1, [960, 560, 0, 0, 3.0]], [SC.escape - 2, [960, 540, E[0], E[1], 8]]], easeIO);
}
const SPREAD = b => (b.sun ? 30 : b.earth ? 24 : 22);  // a 2D image sprawls far wider than the body it was
const FLAT = 3.5;                                      // seconds a body takes to fall flat
const toScreen = ([px, py, fx, fy, z], x, y) => { const dx = (x - fx) * z, dy = (y - fy) * z * TILT; return [px + dx * Math.cos(ROT) - dy * Math.sin(ROT), py + dx * Math.sin(ROT) + dy * Math.cos(ROT)]; };
function inPlane(v) { ctx.translate(v[0], v[1]); ctx.rotate(ROT); ctx.scale(v[4], v[4] * TILT); ctx.translate(-v[2], -v[3]); }
function iridescent(hue, turn) {

  [[0, -40], [0.25, 20], [0.5, 80], [0.75, 140], [1, -40]].forEach(([s, h]) => g.addColorStop(s, `hsl(${hue + h},85%,72%)`));

}
function paintDisc(b, D, a, t, v) {                   // a flattened body: a dark medallion engraved in iridescent line
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(t * 0.02 + b.ph); ctx.scale(D, D);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = (b.earth ? 0.7 : 0.32) * a; ctx.fillStyle = '#05070d';   // thin backing: the layers show through, Earth stands out
  ctx.beginPath(); ctx.arc(0, 0, 1, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.9 * a; ctx.strokeStyle = iridescent(b.hue, t * 0.05 + b.ph);
  ctx.lineWidth = 1.1 / (D * v[4] * 0.6);
  ctx.stroke(b.path);
  if (b.earth) {                                     // Earth's whole history, a ring of marks etched into it
    ctx.fillStyle = `hsl(190,80%,80%)`;
    for (const [an, rr, len, dot] of GLYPHS) {
      ctx.save(); ctx.rotate(an); ctx.translate(rr, 0);
      if (dot) { ctx.beginPath(); ctx.arc(0, 0, 0.008, 0, TAU); ctx.fill(); } else ctx.fillRect(0, -0.003, len, 0.006);
      ctx.restore();

  }

}
function drawFall(t) {                                // the 2D front flattens the Solar System
  if (t < SC.fall || t > SC.escape + 0.4) return;
  const v = fallView(t), rho = rhoAt(t), A = 1 - ramp(t, SC.escape, SC.escape + 0.4);
  ctx.save(); inPlane(v);
  ctx.globalCompositeOperation = 'lighter'; ctx.lineWidth = 1.2 / (v[4] * 0.6);
  ctx.strokeStyle = `rgba(150,180,230,${0.24 * A})`;  // the orbits, still three-dimensional
  for (const r of ORBITS) { ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke(); }
  ctx.save(); ctx.beginPath(); ctx.arc(IMPACT[0], IMPACT[1], rho, 0, TAU); ctx.clip();   // inside the edge: the painting
  const sheen = ctx.createRadialGradient(IMPACT[0], IMPACT[1], 0, IMPACT[0], IMPACT[1], Math.max(1, rho));
  sheen.addColorStop(0, `rgba(70,50,130,${0.05 * A})`); sheen.addColorStop(0.9, `rgba(40,90,160,${0.06 * A})`); sheen.addColorStop(1, `rgba(170,210,255,${0.14 * A})`);
  ctx.fillStyle = sheen; ctx.fillRect(IMPACT[0] - rho, IMPACT[1] - rho, 2 * rho, 2 * rho);
  ctx.lineWidth = 0.7 / (v[4] * 0.6);
  for (let j = 0; j < 40; j++) {                      // engraved ripples of the fall, running out with the edge
    const rr = rho - j * 6 - (t * 6) % 6; if (rr <= 0) continue;
    ctx.strokeStyle = `hsla(${190 + j * 4},80%,74%,${0.10 * A * (1 - j / 40)})`; ctx.beginPath(); ctx.arc(IMPACT[0], IMPACT[1], rr, 0, TAU); ctx.stroke();
  }
  ctx.lineWidth = 1.2 / (v[4] * 0.6);
  ctx.strokeStyle = `rgba(255,214,150,${0.5 * A})`;   // the orbits, now drawn lines in the painting
  for (const r of ORBITS) { ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke(); }
  ctx.restore();
  const hero = ease(ramp(t, CUE.earth + 1, SC.escape - 4));   // closing in on Earth, the rest of the painting steps back
  for (const b of BODIES) {                           // flattened bodies, in the order they fell (Earth on top)
    const f = easeIO(ramp(t, b.hit, b.hit + FLAT));
    if (f > 0) paintDisc(b, b.size * 0.6 * (1 + SPREAD(b) * f), f * A * (b.earth ? 1 : lerp(1, 0.38, hero)), t, v);
  }
  ctx.lineWidth = 2.6 / (v[4] * 0.6);                 // the edge itself, iridescent
  ctx.shadowColor = 'rgba(190,210,255,0.9)'; ctx.shadowBlur = 20; ctx.globalAlpha = 0.95 * A * ramp(t, SC.fall, SC.fall + 0.6);
  ctx.save(); ctx.translate(IMPACT[0], IMPACT[1]); ctx.strokeStyle = iridescent(210, t * 0.3);
  ctx.beginPath(); ctx.arc(0, 0, rho, 0, TAU); ctx.stroke(); ctx.restore();
  ctx.restore();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const sunS = toScreen(v, 0, 0);
  for (const b of BODIES) {                           // bodies still round: lit from the Sun, squashing flat as they fall
    const f = easeIO(ramp(t, b.hit, b.hit + FLAT)); if (f >= 1) continue;
    const [x, y] = toScreen(v, b.x, b.y), R = b.size * v[4] * 0.6;
    if (b.sun) { glow(GLOW.gold, x, y, R * 14, 0.9 * (1 - f) * A); glow(GLOW.white, x, y, R * 2.4, (1 - f) * A); continue; }
    ctx.save(); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = (1 - f) * A; ctx.translate(x, y); ctx.scale(1, 1 - 0.97 * f);
    const L = Math.atan2(sunS[1] - y, sunS[0] - x), g = ctx.createRadialGradient(R * 0.45 * Math.cos(L), R * 0.45 * Math.sin(L), R * 0.1, 0, 0, R);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.25, b.col); g.addColorStop(1, '#05070c');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, Math.max(1, R), 0, TAU); ctx.fill();
    if (b.ring) { ctx.strokeStyle = 'rgba(230,205,150,0.7)'; ctx.lineWidth = Math.max(0.8, R * 0.25); ctx.beginPath(); ctx.ellipse(0, 0, R * 2.3, R * 0.7, -0.3, 0, TAU); ctx.stroke(); }
    ctx.restore();

  glow(GLOW.white, ix, iy, 320, 0.95 * Math.exp(-(t - SC.fall) / 0.3)); glow(GLOW.ice, ix, iy, 700, 0.5 * Math.exp(-(t - SC.fall) / 0.8));
  for (const b of [BODIES.find(b => b.sun), EARTH]) { // the two big falls: the Sun burns white-gold, Earth goes out cold
    const p = t - b.hit; if (p < 0 || p > 4) continue;
    const [x, y] = toScreen(v, b.x, b.y), k = Math.exp(-p / (b.sun ? 0.5 : 0.35));
    glow(b.sun ? GLOW.white : GLOW.ice, x, y, b.sun ? 1400 : 700, 0.9 * k);
    ctx.fillStyle = b.sun ? `rgba(255,220,160,${0.22 * k})` : `rgba(150,200,255,${0.14 * k})`; ctx.globalAlpha = 1; ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
  for (const b of BODIES) {                           // each name, quietly, as it goes flat
    if (!b.zh) continue;
    const a = window01(t, b.hit + 0.3, b.hit + 3.2, 0.5, 0.8) * A; if (a <= 0) continue;
    const [x, y] = toScreen(v, b.x, b.y);
    text(b.zh, x, y - Math.max(26, b.size * v[4] * 0.9) - 18, { size: 26, track: 0.3, alpha: 0.75 * a, blur: 10 });
  }
}

// ---- scenes still to come ----------------------------------------------------------------------------------
function drawEscape(t) {}                             // the light-speed ship, the painting, the end

// ---- cards and subtitles -------------------------------------------------------------------------------
function cards(t) {
  for (const c of TL.cards) {
    if (t < c.t0 || t >= c.t1) continue;
    const a = window01(t, c.t0, c.t1, 0.8, 0.6);
    if (c.kind === 'title') {
      const k = lerp(1, 1.04, ramp(t, c.t0, c.t1));
      ctx.save(); ctx.translate(W / 2, H * 0.3); ctx.scale(k, k);
      text(c.text, 0, 0, { size: 132, weight: 600, track: 0.5, alpha: a, glow: 'rgba(255,214,150,0.35)', blur: 40 });
      ctx.restore();
    } else if (c.kind === 'quote') {
      text(c.text, W / 2, H * 0.3, { size: 64, weight: 400, track: 0.12, color: ICE, alpha: a, glow: 'rgba(140,180,255,0.55)', blur: 30 });
    } else if (c.kind === 'end') {
      text(c.text, W / 2, H / 2 - 24, { size: 56, weight: 400, track: 0.1, alpha: a, blur: 18 });
    } else if (c.kind === 'credit') {
      text(c.text, W / 2, H / 2 + 62, { size: 28, weight: 400, track: 0.2, alpha: 0.6 * a });
    }
  }
}
function subtitles(t) {
  for (const s of TL.subs) {
    if (t < s.t0 || t >= s.t1) continue;
    text(s.zh, W / 2, H - 92, { size: 34, weight: 400, track: 0.06, alpha: window01(t, s.t0, s.t1, 0.18, 0.18), blur: 12 });
  }
}

// ---- the frame -----------------------------------------------------------------------------------------
async function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'none'; ctx.shadowBlur = 0; ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.lineWidth = 1;   // every frame starts from the same state
  backdrop();
  stars(t, 1);
  drawFleet(t); drawSinger(t); drawFall(t); drawEscape(t);
  vignette(0.6);
  cards(t); subtitles(t);
  grain(t);
  const black = Math.max(1 - ease(ramp(t, 0, 1.5)), ease(ramp(t, DURATION - 1.2, DURATION)));
  if (black > 0.001) { ctx.globalAlpha = black; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

window.DURATION = DURATION;
window.EVENTS = { duration: DURATION, cuts: [...Object.values(SC).slice(1), ...CUE.kills, CUE.flick, ...CUE.planets, CUE.earth].sort((a, b) => a - b) };
window.seek = async t => render(clamp(t, 0, DURATION - 1e-6));
Promise.all([`400 34px ${ZH}`, `600 132px ${ZH}`].map(f => document.fonts.load(f))).then(() => {
  // a gradient changes how Chrome rasterises later blended draws on this canvas, so draw one before any frame:
  // then a frame looks the same whether it is a page's first or follows others (render.mjs --check)
  vignette(0.5); grain(0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  window.READY = true;
});

  const t0 = performance.now();
  const loop = async () => { await render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
