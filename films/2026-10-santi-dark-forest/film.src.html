<!doctype html>
<html><head><meta charset="utf-8"><title>黑暗森林</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas width="1920" height="1080"></canvas>
<script>
// 黑暗森林: the droplet's Doomsday Battle and the Singer's dual-vector foil, cut to "Interstellar Space Travel".
// Frame contract: window.DURATION (seconds) and async window.seek(t); every value is a pure function of t.
// Static tables (stars, ships, line art) are built once from seeded generators and never mutated.
const TL = JSON.parse(__TEXT:timeline.json__), CUE = TL.cue, SC = TL.scenes;
const W = 1920, H = 1080, DURATION = TL.duration;
const INK = '#e8ecf4', GOLD = '#ffcf7a', ICE = '#bcd3ff', SPACE = '#04060b';
const ZH = '"Songti SC", "STSong", serif';
const cv = document.querySelector('canvas'), ctx = cv.getContext('2d');

// ---- time helpers --------------------------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x * x * (3 - 2 * x);
const easeIO = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const window01 = (t, a, b, fin = 0.4, fout = 0.4) => ease(ramp(t, a, a + fin)) * (1 - ease(ramp(t, b - fout, b)));
const lerp = (a, b, k) => a + (b - a) * k;
const TAU = Math.PI * 2;
function rng(seed) {                                   // mulberry32: the same seed gives the same table every load
  return () => { seed = (seed + 0x6D2B79F5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
}

// ---- type ----------------------------------------------------------------------------------------------
function text(s, x, y, { size = 34, weight = 400, font = ZH, color = INK, alpha = 1, track = 0, align = 'center', blur = 0, glow = null, halo = false } = {}) {
  if (alpha <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = `${track}em`;
  // letterSpacing adds space after the last glyph too; shift centred text back by half of it
  const tx = x + (align === 'center' ? track * size / 2 : 0);
  if (halo) { ctx.strokeStyle = 'rgba(3,5,10,0.9)'; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.strokeText(s, tx, y); }   // reads over line work
  if (blur || glow) { ctx.shadowColor = glow || 'rgba(0,0,0,0.85)'; ctx.shadowBlur = blur || 24; }
  ctx.fillText(s, tx, y);
  ctx.restore();
}

// ---- sky -----------------------------------------------------------------------------------------------
const STARS = (() => {
  const r = rng(7), tint = ['#9fb4ff', '#cfd8ff', '#ffffff'];
  return Array.from({ length: 2400 }, (_, i) => ({ x: r() * (W + 200), y: r() * H, layer: i % 3,
    s: [0.55, 0.9, 1.5][i % 3] * (0.6 + 0.8 * r()), ph: r() * TAU, f: 0.6 + 2.4 * r(), c: tint[(r() * 3) | 0] }));
})();
const DRIFT = [2, 5, 11];                              // px/s per depth layer: a slow pan the whole film long
function stars(t, a = 1) {
  if (a <= 0.001) return;
  ctx.save();
  for (const s of STARS) {
    const x = ((s.x - t * DRIFT[s.layer]) % (W + 200) + W + 200) % (W + 200) - 100;
    const k = a * (0.75 + 0.25 * Math.sin(t * s.f + s.ph)) * (0.45 + 0.25 * s.layer);
    ctx.globalAlpha = k; ctx.fillStyle = s.c;
    if (s.s < 1.1) ctx.fillRect(x, s.y, s.s, s.s);
    else { ctx.beginPath(); ctx.arc(x, s.y, s.s * 0.6, 0, TAU); ctx.fill(); }
  }
  ctx.restore();
}
function dithered(fn) {                               // a full-frame image computed per pixel with ±½ level of noise: dark gradients cannot band
  const c = Object.assign(document.createElement('canvas'), { width: W, height: H }), g = c.getContext('2d'), d = g.createImageData(W, H), r = rng(404);
  for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i += 4) {
    const [R, G, B, A] = fn(x, y), n = r() - 0.5;     // Uint8ClampedArray rounds and clamps
    d.data[i] = R + n; d.data[i + 1] = G + n; d.data[i + 2] = B + n; d.data[i + 3] = A + n;
  }
  g.putImageData(d, 0, 0); return c;
}
const SKY = dithered((x, y) => {                      // deep space with a faint blue glow right of centre
  const f = Math.max(0, 1 - Math.hypot(x - W * 0.55, y - H * 0.45) / (W * 0.75)), k = 0.9 * f * f;
  return [4 + 10 * k, 6 + 18 * k, 11 + 33 * k, 255.5];
});
const VIGN = dithered((x, y) => [0, 0, 0, 255 * 0.6 * clamp((Math.hypot(x - W / 2, y - H / 2) - H * 0.35) / (H * 0.7))]);
function backdrop() { ctx.drawImage(SKY, 0, 0); }
function vignette(strength) {
  ctx.globalAlpha = strength / 0.6; ctx.drawImage(VIGN, 0, 0); ctx.globalAlpha = 1;
}
const GRAIN = (() => {                                 // seeded noise tile; moved every 1/24 s it reads as film grain and dithers gradients
  const c = Object.assign(document.createElement('canvas'), { width: 256, height: 256 }), g = c.getContext('2d'), d = g.createImageData(256, 256);
  let s = 20261031;
  for (let i = 0; i < d.data.length; i += 4) { s = (s * 1664525 + 1013904223) >>> 0; const v = s >>> 24; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
})();
function grain(t) {
  const f = Math.floor(t * 24), ox = (f * 97) % 256, oy = (f * 61) % 256;
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.07;
  ctx.translate(-ox, -oy); ctx.fillStyle = ctx.createPattern(GRAIN, 'repeat'); ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = 0.03;   // and a few levels of additive noise: dithers the dark gradients
  ctx.translate(97, 41); ctx.fillRect(-97, -41, W + 256, H + 256);
  ctx.restore();
}

// ---- glow sprites (drawn additively; built once) ---------------------------------------------------------
function sprite(rgb, size = 64) {
  const c = Object.assign(document.createElement('canvas'), { width: size, height: size }), g = c.getContext('2d');
  const r = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  r.addColorStop(0, `rgba(${rgb},1)`); r.addColorStop(0.25, `rgba(${rgb},0.45)`); r.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = r; g.fillRect(0, 0, size, size); return c;
}
const GLOW = { gold: sprite('255,200,120'), white: sprite('255,248,235'), ember: sprite('255,110,40'), ice: sprite('170,215,255'), fire: sprite('255,175,80') };
function glow(img, x, y, d, a) { if (a > 0.003 && d > 0.5) { ctx.globalAlpha = Math.min(1, a); ctx.drawImage(img, x - d / 2, y - d / 2, d, d); } }

// ---- the cold open: the galaxy, the forest, and a few eyes in it (gl-galaxy.js) ---------------------------
function drawOpen(t) {
  if (t >= SC.fleet - 0.05) return;                   // cut to the fleet leaving Earth
  ctx.drawImage(COLD.draw(t), 0, 0);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [x, y, front, at] of COLD.eyes(t)) {     // an eye opens on a star: a cold flare, then it watches
    const a = ease(ramp(t, at, at + 0.5)) * lerp(1, 0.45, ease(ramp(t, at + 0.5, at + 2.5))) * (1 - ramp(t, SC.fleet - 0.6, SC.fleet - 0.05));
    if (front && a > 0) { glow(GLOW.ice, x, y, 90, 0.75 * a); glow(GLOW.ice, x, y, 26, 0.9 * a); glow(GLOW.white, x, y, 10, a); }
  }
  ctx.restore();
}

// ---- the Doomsday Battle: 2,016 ships and a flagship, one droplet ----------------------------------------
// World: x right, y up, z away from the camera; the fleet is a slab of COLS x ROWS ships about SP apart, jittered
// and varied so it never reads as a grid. From the first accent the droplet never stops: on each accent it
// bursts into one region of the slab and zigzags through it, irregularly, until the next. Every ship dies when
// the first blast from the droplet's track reaches it, so the dead spread from the track like fire, with no lanes.
// The flagship in front dies first. About 1% never die: they run.
const COLS = 48, ROWS = 42, SP = 60, F = 1200, BLAST = 300, REACH = 240;   // the blast outruns the eye less: deaths travel as a front
const ORDER = [1, 2, 0, 3];                            // the region each strike tears through: centre-left, centre-right, left, right
const BANDX = ORDER.map(b => ((b + 0.5) * COLS / 4 - 0.5 - (COLS - 1) / 2) * SP);
const TRACK = (() => {                                 // per strike: seven waypoints swinging side to side as it crosses the depth
  const r = rng(29), Zn = -250, Zf = (ROWS - 1) * SP + 150;
  return BANDX.map((bx, k) => Array.from({ length: 7 }, (_, i) => {
    const z = lerp(k % 2 ? Zn : Zf, k % 2 ? Zf : Zn, i / 6) + (r() - 0.5) * 420;
    return [bx + (i % 2 ? 1 : -1) * (110 + 230 * r()) + (r() - 0.5) * 140, 0, z];
  }));
})();
const TRACKLEN = TRACK.map(p => p.reduce((L, q, i) => (i ? [...L, L[i - 1] + Math.hypot(q[0] - p[i - 1][0], q[2] - p[i - 1][2])] : [0]), []));
function trackAt(k, u) {
  const p = TRACK[k], L = TRACKLEN[k], s = clamp(u) * L.at(-1);
  let i = 1; while (i < L.length - 1 && L[i] < s) i++;
  const f = (s - L[i - 1]) / (L[i] - L[i - 1]);
  return [lerp(p[i - 1][0], p[i][0], f), 0, lerp(p[i - 1][2], p[i][2], f)];
}
const strikeEnd = k => (k < 3 ? CUE.kills[k + 1] - 0.45 : SC.ember - 1);
function dropletAt(t) {                                // world position of the droplet after the close-up
  const K = CUE.kills;
  for (let k = 0; k < 4; k++) {
    const e = strikeEnd(k);
    if (t < e) return trackAt(k, 0.5 * (1 - Math.pow(1 - ramp(t, K[k], K[k] + 0.9), 3)) + 0.5 * ramp(t, K[k] + 0.9, e));   // half on the hit
    if (k < 3 && t < K[k + 1]) {                       // a fast hop to where the next strike begins
      const u = easeIO(ramp(t, e, K[k + 1])), p = TRACK[k].at(-1), q = TRACK[k + 1][0];
      return [lerp(p[0], q[0], u), 180 * Math.sin(Math.PI * u), lerp(p[2], q[2], u)];
    }
  }
  const u = ramp(t, SC.ember - 1, SC.ember + 2), p = TRACK[3].at(-1);   // and away, over the horizon
  return [p[0] + 2000 * u * u, 900 * u * u, p[2] + 14000 * u * u];
}
const HULLS = [                                        // three silhouettes, nose to the right, unit half-length
  [[-1, 0], [-0.55, -0.22], [0.7, -0.13], [1, 0], [0.7, 0.13], [-0.55, 0.22]],
  [[-1, -0.1], [-0.8, -0.3], [0.2, -0.18], [1, 0], [0.2, 0.18], [-0.8, 0.3], [-1, 0.1]],
  [[-1, 0], [-0.7, -0.16], [-0.1, -0.26], [0.5, -0.14], [1, 0], [0.5, 0.14], [-0.1, 0.26], [-0.7, 0.16]],
];
const SHIPS = (() => {
  const r = rng(11), out = [];
  const add = (x, y, z, row, extra = {}) => out.push({ x, y, z, row, run: r() < 0.012, dir: r() * TAU, jit: r() * 0.15, hull: Math.floor(r() * 3),
    sz: 0.8 + 0.45 * r(), hd: (r() - 0.5) * 0.12, fr: r(), deb: [0, 1, 2].map(() => [r() * TAU, 40 + 90 * r(), (r() - 0.5) * 60]), ...extra });
  add(-330, 30, -260, -1, { flag: true, sz: 3.2, run: false, hd: -0.03 });   // the flagship, out in front
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) add((i - (COLS - 1) / 2) * SP + (r() - 0.5) * 28, (r() - 0.5) * 40, j * SP + (r() - 0.5) * 28, j);
  const samples = [];                                  // the strikes in time (not the hops between them), every 10 ms
  for (let k = 0; k < 4; k++) for (let t = CUE.kills[k]; t < strikeEnd(k); t += 0.01) { const p = dropletAt(t); samples.push([t, p[0], p[2]]); }
  for (const s of out) {                               // dies when the first blast reaches it; past REACH only a slow chain carries
    let tk = Infinity; const v = BLAST * (0.7 + 0.6 * s.fr);
    for (const [t, x, z] of samples) { const d = Math.hypot(x - s.x, z - s.z), a = t + d / v + Math.max(0, d - REACH) / 70; if (a < tk) tk = a; }
    s.tk = s.run ? Infinity : s.flag ? CUE.kills[3] : tk + 0.04 * s.jit;   // the flagship goes on the last accent, in the foreground
  }
  return out;
})();

function camAt(t) {                                    // the wide: low over the slab, dolly in on the reveal, settle and drift
  if (t >= CUE.kills[1] && t < CUE.kills[2]) {         // the second strike, from inside the formation, beside the band it cuts
    const u = t - CUE.kills[1];
    return { x: 1000 - 30 * u, y: 150, z: 240 + 70 * u, pitch: 0.13, yaw: -0.42, roll: 0.02 * Math.sin(t * 0.7), cy: H * 0.45 };   // high enough that the slab spreads out below
  }
  const a = easeIO(ramp(t, SC.fleet, SC.drop)), b = ease(ramp(t, CUE.kills[0], SC.foil));
  const c = { x: lerp(-120, 260, b), y: lerp(620, 380, a) - 40 * b, z: lerp(-2600, -1250, a) + lerp(0, 220, b), yaw: 0,
              roll: 0.05 * Math.sin(t * 0.11) - 0.05 * a, cy: lerp(H * 0.62, H * 0.5, a) };   // cy: the slab sits low under the title
  c.pitch = Math.atan2(c.y, 1500 - c.z);
  return c;
}
function project(c, X, Y, Z) {
  let dx = X - c.x, dy = Y - c.y, dz = Z - c.z;
  if (c.yaw) { const cw = Math.cos(c.yaw), sw = Math.sin(c.yaw); [dx, dz] = [dx * cw - dz * sw, dx * sw + dz * cw]; }
  const cp = Math.cos(c.pitch), sp = Math.sin(c.pitch), y1 = dy * cp + dz * sp, z1 = -dy * sp + dz * cp;
  if (z1 < 90) return null;
  const s = F / z1, sx = dx * s, sy = -y1 * s, cr = Math.cos(c.roll), sr = Math.sin(c.roll);
  return [W / 2 + sx * cr - sy * sr, c.cy + sx * sr + sy * cr, s, z1];
}
function drawFleet(t) {                               // fleet, drop, ember: the Doomsday Battle
  drawOpen(t);
  const END = SC.ember + 7.0;                          // the wreck field holds ~3 s, then the camera cranes up off it
  if (t < SC.fleet - 0.05 || t > END) return;
  if (t < (subAt('列成方阵')?.t0 ?? SC.fleet + 7.1)) { ctx.drawImage(LEAVE.draw(t), 0, 0); return; }   // leaving Earth (gl-earth.js)
  ctx.drawImage(FLEET.draw(t), 0, 0);                 // the battle in 3D (gl-fleet.js), the droplet's close-up included
}

// ---- the Singer: a glance, and a slip of paper (gl-singer.js) ------------------------------------------------
// The Singer is never drawn, only its eye: a vast, cold iris of sensing points that opens over the galaxy as the
// wreck field cranes away, and turns until its bright arc faces the Sun, which it notices as the narration says
// "瞥了一眼". The foil appears on that arc as it is "taken out" and waits there (cut in close, it turns edge-on and is
// gone to a hairline); on the 1:14 accent it snaps away to the Sun, and the camera follows it down.
const OPEN = SC.ember + 7.3;
const subAt = word => TL.subs.find(s => s.zh.includes(word));
const glanceHits = (subAt('瞥')?.t1 ?? SC.ember + 12.3) - 0.4;     // the glance lands on "瞥了一眼"
const FOIL_IN = subAt('二向箔')?.t0 ?? SC.ember + 12.2;              // and the foil is taken out on "二向箔"
const CL0 = SC.ember + 18.6, CL1 = CL0 + 4.0;          // the foil, close
// The eye is vast and near: three rings of sensing points seen in perspective, a tilted ellipse whose centre lies off the
// frame at lower left, so only its arcs cross the picture; near points are larger; it drifts against the far galaxy.
const IR = 1150, SQ = 0.4, TILT = -0.22;
const irisC = t => { const k = easeIO(ramp(t, OPEN, CUE.flick)); return [-170 + 60 * k, 950 - 25 * k]; };
const onIris = (t, a, rr = 1) => { const [cx, cy] = irisC(t), x = IR * rr * Math.cos(a), y = IR * rr * SQ * Math.sin(a);
  return [cx + x * Math.cos(TILT) - y * Math.sin(TILT), cy + x * Math.sin(TILT) + y * Math.cos(TILT)]; };
const face = t => { const [x, y] = SING.sunPx(t), [cx, cy] = irisC(t), dx = x - cx, dy = y - cy;   // the angle on the ellipse that points at the Sun
  const u = dx * Math.cos(TILT) + dy * Math.sin(TILT), v = -dx * Math.sin(TILT) + dy * Math.cos(TILT); return Math.atan2(v / SQ, u); };
const irisAlpha = t => ease(ramp(t, OPEN, OPEN + 1.5)) * lerp(1, 0.6, ease(ramp(t, CUE.flick, CUE.flick + 0.6))) * (1 - ease(ramp(t, CUE.flick + 0.6, CUE.flick + 2.4)));
const arcAngle = t => face(t) - 0.9 * (1 - easeIO(ramp(t, OPEN + 0.8, glanceHits)));   // the bright arc slides round to face the Sun
const arcPoint = t => onIris(t, arcAngle(t), 0.6 + 0.4 * ease(ramp(t, OPEN, OPEN + 2.5)));
const foilAnchor = t => { const [x, y] = arcPoint(t); return [x + 30, y - 46 + 6 * Math.sin(t * 1.7)]; };   // where the foil waits, just off the arc, bobbing
function drawIris(t, sun) {                           // the Singer's eye
  const A = irisAlpha(t); if (A <= 0.001) return;
  const open = 0.6 + 0.4 * ease(ramp(t, OPEN, OPEN + 2.5)), sweep = ramp(t, OPEN, OPEN + 2);
  const breathe = (1 + 0.006 * Math.sin(t * 1.3)) * (1 - 0.07 * window01(t, glanceHits - 0.6, glanceHits + 1.4, 0.35, 0.9));   // on the glance it narrows, like an iris
  const phi = arcAngle(t);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const [n, rr, spin, size] of [[420, 1, 0.012, 12], [300, 0.74, -0.02, 10], [190, 0.5, 0.03, 8]]) {   // three counter-turning rings
    const R = rr * open * breathe;
    ctx.lineWidth = 1; ctx.strokeStyle = `rgba(150,195,255,${0.07 * A})`; ctx.beginPath();
    for (let i = 0; i <= 256 * sweep; i++) { const [x, y] = onIris(t, i / 256 * TAU, R); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
    for (let i = 0; i < n; i++) {
      if (i / n > sweep) break;
      const a = i / n * TAU + spin * t, [x, y] = onIris(t, a, R);
      if (x < -60 || x > W + 60 || y < -60 || y > H + 60) continue;
      const near = 0.55 + 0.9 * (0.5 + 0.5 * Math.sin(a));   // the near side of the ring, larger
      const h1 = (Math.sin(i * 12.9898 + rr * 78.233) * 43758.5453) % 1, h2 = (Math.sin(i * 39.346 + rr * 11.135) * 24634.6345) % 1;   // each point its own size and strength
      const d = Math.abs(Math.atan2(Math.sin(a - phi), Math.cos(a - phi))), bright = rr === 1 ? Math.exp(-((d / 0.16) ** 2)) : 0;   // the arc
      glow(GLOW.ice, x, y, (size * (0.5 + Math.abs(h1)) + 14 * bright) * near, A * ((0.18 + 0.3 * Math.abs(h2)) * (0.8 + 0.2 * Math.sin(i * 2.3 + t)) + 0.6 * bright));
      if (bright > 0.2) glow(GLOW.ice, x, y, 110 * near, 0.12 * A * bright);   // a cold glow along the arc
    }
  }
  const [ax, ay] = arcPoint(t), g = window01(t, glanceHits - 0.25, glanceHits + 1.8, 0.2, 1.2);   // the glance: a thin cold line to the Sun
  if (g > 0.003) {
    const grad = ctx.createLinearGradient(ax, ay, sun[0], sun[1]);
    grad.addColorStop(0, `rgba(190,225,255,${0.7 * g * A})`); grad.addColorStop(1, `rgba(190,225,255,${0.15 * g * A})`);
    ctx.strokeStyle = grad; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(sun[0], sun[1]); ctx.stroke();
  }
  const p = t - glanceHits;                            // noticed: a cold ring closes on the Sun
  if (p > -0.4 && p < 1.6) { ctx.strokeStyle = `rgba(190,225,255,${0.7 * A * window01(p, -0.4, 1.6, 0.3, 1)})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(sun[0], sun[1], lerp(70, 10, ease(ramp(p, -0.4, 1.2))), 0, TAU); ctx.stroke(); }
  ctx.restore();
}
function drawSinger(t) {                              // the galaxy from far above, the eye, the foil
  if (t < SING.T0 || t >= SING.CUT) return;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const [img, fade] = SING.draw(t, foilAnchor);       // the close-up draws itself: the galaxy defocused, the foil alone
  if (!img) return;
  ctx.globalAlpha = fade; ctx.drawImage(img, 0, 0); ctx.globalAlpha = 1;   // up out of the dark
  const [fx, fy] = SING.foilPx(), sun = SING.sunPx(t);
  drawIris(t, sun);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  glow(GLOW.white, fx, fy, 60, 0.8 * (t >= FOIL_IN ? Math.exp(-(t - FOIL_IN) / 0.25) : 0));   // taken out: a glint
  const [kx, ky] = foilAnchor(CUE.flick);
  glow(GLOW.white, kx, ky, 240, 0.95 * (t >= CUE.flick ? Math.exp(-(t - CUE.flick) / 0.12) : 0));   // the flick
  ctx.restore();
}

// ---- the fall, the escape, the look back, the end (gl-solar.js, gl-pluto.js) ----------------------------------
const LS = SC.escape + 6.2;                           // the escaping ship reaches light speed, on "逃出了"
const BACK0 = LS + 1.2;                               // and a breath later we look back (plan.py: escape + 7.4)
function drawFall(t) {                                // the foil arrives; the Solar System falls into two dimensions
  if (t < SING.CUT || t >= SC.escape) return;         // a hard cut to the escape
  ctx.drawImage(SOL.draw(t), 0, 0);
  for (const [s, x, y, a] of SOL.labels(t)) text(s, x, y, { size: 28, track: 0.3, alpha: 0.85 * a, halo: true });
  const say = subAt('海王星');                          // Neptune's name, as it is spoken, in its own shot
  if (say && t >= SOL.HN0 && t < SOL.HN1) { const [x, y] = SOL.screenOf('neptune'); text('海王星', x, Math.max(80, y - 30), { size: 30, track: 0.3, alpha: 0.85 * window01(t, say.t0, SOL.HN1 - 0.6, 0.4, 0.6), halo: true }); }
}
function drawEscape(t) {                              // the light-speed ship on Pluto, then the painting, the end
  if (t < SC.escape) return;
  if (t < BACK0) { ctx.drawImage(PLU.draw(t), 0, 0); return; }
  ctx.drawImage(SOL.draw(t), 0, 0);                    // the look-back: Pluto falls last, its tablets' words kept in its image
  const endDim = 0.55 * ease(ramp(t, SC.end, SC.end + 2.5));
  if (endDim > 0) { ctx.fillStyle = `rgba(0,0,0,${endDim})`; ctx.fillRect(0, 0, W, H); }
}

// ---- cards and subtitles -------------------------------------------------------------------------------
function cards(t) {
  for (const c of TL.cards) {
    if (t < c.t0 || t >= c.t1) continue;
    const a = window01(t, c.t0, c.t1, 0.8, 0.6);
    if (c.kind === 'title') {
      const k = lerp(1, 1.04, ramp(t, c.t0, c.t1));
      ctx.save(); ctx.translate(W / 2, H * 0.3); ctx.scale(k, k);
      text(c.text, 0, 0, { size: 132, weight: 600, track: 0.5, alpha: a, glow: 'rgba(255,214,150,0.35)', blur: 40 });
      ctx.restore();
    } else if (c.kind === 'quote') {
      text(c.text, W / 2, H * 0.3, { size: 64, weight: 400, track: 0.12, color: ICE, alpha: a, glow: 'rgba(140,180,255,0.55)', blur: 30 });
    } else if (c.kind === 'end') {                    // under the painting, on a dark scrim
      const g = ctx.createLinearGradient(0, H * 0.52, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.35, `rgba(0,0,0,${0.62 * a})`); g.addColorStop(1, `rgba(0,0,0,${0.7 * a})`);
      ctx.fillStyle = g; ctx.fillRect(0, H * 0.52, W, H * 0.48);
      text(c.text, W / 2, H * 0.72, { size: 56, weight: 400, track: 0.1, alpha: a, blur: 18 });
    } else if (c.kind === 'credit') {
      text(c.text, W / 2, H * 0.72 + 64, { size: 28, weight: 400, track: 0.2, alpha: 0.8 * a });
    } else if (c.kind === 'textures') {
      c.text.split('|').forEach((line, i) => text(line, W / 2, H * 0.72 + i * 44, { size: 26, weight: 400, track: 0.05, alpha: 0.7 * a }));
    }
  }
}
function subtitles(t) {
  for (const s of TL.subs) {
    if (t < s.t0 || t >= s.t1) continue;
    const a = window01(t, s.t0, s.t1, 0.18, 0.18), half = s.zh.length * 19 + 120;   // a soft dark scrim: readable over the Sun's image too
    ctx.save(); ctx.translate(W / 2, H - 92); ctx.scale(half, 46); const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    g.addColorStop(0, `rgba(0,0,0,${0.55 * a})`); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(-1, -1, 2, 2); ctx.restore();
    text(s.zh, W / 2, H - 92, { size: 34, weight: 400, track: 0.06, alpha: a, blur: 12 });
  }
}

// ---- the frame -----------------------------------------------------------------------------------------
async function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.filter = 'none'; ctx.shadowBlur = 0; ctx.shadowColor = 'rgba(0,0,0,0)'; ctx.lineWidth = 1;   // every frame starts from the same state
  backdrop();
  stars(t, 1);
  drawFleet(t); drawSinger(t); drawFall(t); drawEscape(t);
  vignette(0.6);
  cards(t); subtitles(t);
  grain(t);
  const black = Math.max(1 - ease(ramp(t, 0, 1.5)), ease(ramp(t, DURATION - 1.2, DURATION)));
  if (black > 0.001) { ctx.globalAlpha = black; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}
