<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Re Sustainability DigiPass: client walkthrough</title>
<style>
  html, body { margin: 0; height: 100%; background: #F7F9FC; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
// Frame contract: window.DURATION (seconds) and async window.seek(t).
// Every visual value is a pure function of t; render() resets the canvas each frame.
// The client version of films/2026-10-nus-digipass: the same workflow presented as the design, for a client's
// management team (no research framing, no open questions). Facts come from "jev /output/nus-digipass-workflow.md";
// timing comes from timeline.json, which plan.py lays out around the narration.
// Colours keep one meaning each: blue = the service, green = a ticket used. Sample values (50 tickets, SXX 1234 X, 1234567890) are labelled as examples.
// Open film.html#play for a live preview; the renderer never uses that path.

const TL = JSON.parse(__TEXT:timeline.json__), CUE = TL.cue, SC = TL.scenes;
const W = 1920, H = 1080, DURATION = TL.duration, BEAT = 60 / TL.bpm;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---- tunables: the deck's tokens -----------------------------------------------------
const C = { bg: '#F7F9FC', card: '#FFFFFF', line: '#D9E2EF', navy: '#0B2A5B', ink: '#1F2937', muted: '#64748B',
            blue: '#1D5FD1', blueBg: '#EAF2FD', blueLine: '#BFD4F6',
            green: '#16A34A', greenBg: '#E8F7EE', grey: '#CBD5E1', glass: '#CFE0F7' };
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
const MONO = 'ui-monospace, SFMono-Regular, Menlo, monospace';
const MX = 150;
const SEAM = 0.3;                 // half-length of a transition (s)
const POP = [3.0, 0.72];          // spring for pops: frequency (Hz), damping
const PLATE = 'SXX 1234 X', IU = '1234567890', POOL = 50;   // example values, shown as examples

// ---- time toolkit ---------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const outExpo = u => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u));
const inExpo = u => (u <= 0 ? 0 : Math.pow(2, 10 * u - 10));
const inOutExpo = u => (u <= 0 ? 0 : u >= 1 ? 1 : u < 0.5 ? Math.pow(2, 20 * u - 10) / 2 : (2 - Math.pow(2, -20 * u + 10)) / 2);
const outCubic = u => 1 - Math.pow(1 - u, 3);
const inOutCubic = u => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
function spring(t, f = 3, z = 0.7) {             // closed-form step response
  if (t <= 0) return 0;
  const w = 2 * Math.PI * f;
  if (z < 1) { const wd = w * Math.sqrt(1 - z * z);
    return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t)); }
  return 1 - Math.exp(-w * t) * (1 + w * t);
}
const pop = at => spring(t - at, ...POP);
const fade = (a, b) => outCubic(prog(t, a, b));

// ---- drawing helpers (scene functions read the local time `t` and their cues through L) ----
let t = 0, T0 = 0;
const L = (k, i) => (i === undefined ? CUE[k] : CUE[k][i]) - T0;
const font = (size, w = 600, f = FONT) => { ctx.font = `${w} ${size}px ${f}`; };
const bg = (c = C.bg) => { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); };
function dot(x, y, r, c) { if (r <= 0) return; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = c; ctx.fill(); }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function box(x, y, w, h, r, fill, stroke, lw = 2) {
  rr(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function line(x0, y0, x1, y1, c, w) {
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1);
  ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.stroke();
}
function label(str, x, y, size, o = {}) {
  const { w = 600, c = C.ink, align = 'left', f = FONT, base = 'alphabetic', ls = '0px' } = o;
  font(size, w, f); ctx.letterSpacing = ls; ctx.fillStyle = c; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.fillText(str, x, y); ctx.letterSpacing = '0px';
}
function width(str, size, w = 600, f = FONT) { font(size, w, f); return ctx.measureText(str).width; }
function scaled(cx, cy, s, fn) { if (s <= 0) return; ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy); fn(); ctx.restore(); }
function alpha(a, fn) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= clamp(a); fn(); ctx.restore(); }

// Kinetic type: words rise from under the baseline inside a clip and leave upward.
function rise(str, x, y, size, o = {}) {
  const { w = 700, c = C.navy, align = 'left', at = 0, out = 1e9, gap = 0.06, dur = 0.7, f = FONT } = o;
  if (t < at || t > out + 1) return;
  font(size, w, f);
  const words = str.split(' ');
  const sp = ctx.measureText(' ').width;
  const ws = words.map(s => ctx.measureText(s).width);
  const total = ws.reduce((a, b) => a + b, 0) + sp * (words.length - 1);
  let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  ctx.save();
  ctx.beginPath(); ctx.rect(cx - 16, y - size * 1.05, total + 32, size * 1.4); ctx.clip();
  ctx.fillStyle = c; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  words.forEach((s, i) => {
    const a = outExpo(prog(t, at + i * gap, at + i * gap + dur));
    const b = inExpo(prog(t, out + i * gap * 0.5, out + i * gap * 0.5 + 0.3));
    if (a > 0 && b < 1) ctx.fillText(s, cx, y + (1 - a) * size * 1.3 - b * size * 1.3);
    cx += ws[i] + sp;
  });
  ctx.restore();
}
function pill(str, cx, cy, fg, bgc, s = 1, size = 26, o = {}) {
  if (s <= 0) return 0;
  const { w = 700, border = null } = o;
  font(size, w); const pw = ctx.measureText(str).width + size * 1.4, ph = size * 1.8;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  rr(-pw / 2, -ph / 2, pw, ph, ph / 2); ctx.fillStyle = bgc; ctx.fill();
  if (border) { ctx.strokeStyle = border; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(str, 0, 2);
  ctx.restore();
  return pw;
}
function tick(x, y, s, at, c, lw = 0.2) {               // stroke-drawn check mark
  const p = outCubic(prog(t, at, at + 0.25)); if (p <= 0) return;
  const a = [x - 0.45 * s, y + 0.02 * s], b = [x - 0.12 * s, y + 0.34 * s], d = [x + 0.48 * s, y - 0.32 * s];
  const p1 = clamp(p / 0.4), p2 = clamp((p - 0.4) / 0.6);
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(lerp(a[0], b[0], p1), lerp(a[1], b[1], p1));
  if (p2 > 0) ctx.lineTo(lerp(b[0], d[0], p2), lerp(b[1], d[1], p2));
  ctx.strokeStyle = c; ctx.lineWidth = s * lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}
function checkBadge(x, y, r, at, c = C.blue) {          // a filled disc with a white tick
  const s = pop(at); if (s <= 0) return;
  dot(x, y, r * s, c); tick(x, y + r * 0.05, r * 1.0, at + 0.08, '#fff', 0.22);
}

// The protagonist: a parking ticket with a perforated stub and two notches.
function ticketPath(x, y, w, h, r, sx, nr) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(sx - nr, y); ctx.arc(sx, y, nr, Math.PI, 0, true);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(sx + nr, y + h); ctx.arc(sx, y + h, nr, 0, Math.PI, true);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
}
// (cx, cy) is the centre; state: 'blue' | 'green' | 'ghost' (an empty slot) | 'grey'
function ticket(cx, cy, w, h, o = {}) {
  const { state = 'blue', s = 1, rot = 0, text = '', sub = '' } = o;
  if (s <= 0) return;
  const col = { blue: C.blue, green: C.green, ghost: C.grey, grey: C.muted }[state];
  const tint = { blue: C.blueBg, green: C.greenBg, ghost: 'rgba(0,0,0,0)', grey: '#EEF2F7' }[state];
  const x = -w / 2, y = -h / 2, sx = x + w * 0.7, nr = Math.max(4, h * 0.12), r = Math.max(4, h * 0.14);
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(s, s);
  ticketPath(x, y, w, h, r, sx, nr);
  if (state === 'ghost') { ctx.setLineDash([6, 6]); ctx.strokeStyle = C.grey; ctx.lineWidth = 2; ctx.stroke(); ctx.restore(); return; }
  ctx.fillStyle = C.card; ctx.fill();
  ctx.save(); ctx.clip(); ctx.fillStyle = tint; ctx.fillRect(sx, y, w, h); ctx.restore();
  ctx.strokeStyle = col; ctx.lineWidth = Math.max(2, h * 0.05); ctx.stroke();
  ctx.setLineDash([h * 0.07, h * 0.07]); line(sx, y + nr + 3, sx, y + h - nr - 3, col, Math.max(1.5, h * 0.03)); ctx.setLineDash([]);
  // stub: a P in a rounded square, or a tick once used
  const k = Math.min(w * 0.3 - 10, h * 0.6);
  if (state === 'green') tick(sx + w * 0.15, 0, k * 0.8, -1e9, C.green, 0.2);
  else { box(sx + w * 0.15 - k / 2, -k / 2, k, k, k * 0.22, col); label('P', sx + w * 0.15, k * 0.36, k * 0.78, { w: 800, c: '#fff', align: 'center' }); }
  // face: a title and a sub line, or two text bars when there's no text
  if (text) {
    label(text, x + w * 0.08, sub ? -h * 0.04 : h * 0.12, Math.min(h * 0.26, 40), { w: 800, c: C.navy });
    if (sub) label(sub, x + w * 0.08, h * 0.28, Math.min(h * 0.17, 28), { w: 600, c: C.muted });
  } else {
    box(x + w * 0.1, -h * 0.17, w * 0.42, h * 0.12, h * 0.06, col);
    box(x + w * 0.1, h * 0.07, w * 0.28, h * 0.1, h * 0.05, C.blueLine);
  }
  ctx.restore();
}

// A side-view car facing right: x is its left edge, g the ground line.
function car(x, g, w, o = {}) {
  const { body = C.navy } = o;
  ctx.save();
  rr(x, g - w * 0.27, w, w * 0.17, w * 0.06); ctx.fillStyle = body; ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + w * 0.16, g - w * 0.26); ctx.lineTo(x + w * 0.3, g - w * 0.42);
  ctx.lineTo(x + w * 0.64, g - w * 0.42); ctx.lineTo(x + w * 0.82, g - w * 0.26); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.glass;
  ctx.beginPath(); ctx.moveTo(x + w * 0.23, g - w * 0.27); ctx.lineTo(x + w * 0.325, g - w * 0.385); ctx.lineTo(x + w * 0.465, g - w * 0.385); ctx.lineTo(x + w * 0.465, g - w * 0.27); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + w * 0.495, g - w * 0.27); ctx.lineTo(x + w * 0.495, g - w * 0.385); ctx.lineTo(x + w * 0.625, g - w * 0.385); ctx.lineTo(x + w * 0.745, g - w * 0.27); ctx.closePath(); ctx.fill();
  rr(x + w * 0.955, g - w * 0.235, w * 0.035, w * 0.045, 3); ctx.fillStyle = '#FDE68A'; ctx.fill();
  rr(x + w * 0.01, g - w * 0.235, w * 0.03, w * 0.045, 3); ctx.fillStyle = '#FCA5A5'; ctx.fill();
  for (const wx of [0.22, 0.78]) { dot(x + w * wx, g - w * 0.085, w * 0.085, '#1F2937'); dot(x + w * wx, g - w * 0.085, w * 0.038, C.grey); }
  ctx.restore();
}
function phone(x, y, w, h) {                               // the frame; returns the screen rect
  box(x, y, w, h, 44, C.navy);
  box(x + 12, y + 12, w - 24, h - 24, 34, C.card);
  box(x + w / 2 - 50, y + 22, 100, 22, 11, C.navy);
  return [x + 12, y + 12, w - 24, h - 24];
}
// Small drawn icons, centred on (x, y), size s.
const ICON = {
  calendar(x, y, s, c) { box(x - s / 2, y - s * 0.38, s, s * 0.82, s * 0.12, null, c, s * 0.09); line(x - s / 2, y - s * 0.12, x + s / 2, y - s * 0.12, c, s * 0.09);
    line(x - s * 0.22, y - s * 0.5, x - s * 0.22, y - s * 0.3, c, s * 0.09); line(x + s * 0.22, y - s * 0.5, x + s * 0.22, y - s * 0.3, c, s * 0.09);
    for (let i = 0; i < 3; i++) dot(x - s * 0.24 + i * s * 0.24, y + s * 0.14, s * 0.06, c); },
  person(x, y, s, c) { dot(x, y - s * 0.2, s * 0.2, c); ctx.beginPath(); ctx.arc(x, y + s * 0.42, s * 0.36, Math.PI, 0); ctx.closePath(); ctx.fillStyle = c; ctx.fill(); },
  coin(x, y, s, c) { ctx.beginPath(); ctx.arc(x, y, s * 0.46, 0, 7); ctx.strokeStyle = c; ctx.lineWidth = s * 0.09; ctx.stroke(); label('$', x, y + s * 0.2, s * 0.56, { w: 800, c, align: 'center' }); },
  pin(x, y, s, c) { ctx.beginPath(); ctx.arc(x, y - s * 0.12, s * 0.34, Math.PI * 0.85, Math.PI * 0.15); ctx.lineTo(x, y + s * 0.5); ctx.closePath(); ctx.fillStyle = c; ctx.fill();
    label('P', x, y - s * 0.01, s * 0.38, { w: 800, c: '#fff', align: 'center' }); },
  link(x, y, s, c) { ctx.save(); ctx.translate(x, y); ctx.rotate(-Math.PI / 4);
    for (const d of [-1, 1]) { rr(d * s * 0.2 - s * 0.26, -s * 0.15, s * 0.52, s * 0.3, s * 0.15); ctx.strokeStyle = c; ctx.lineWidth = s * 0.09; ctx.stroke(); }
    ctx.restore(); },
  lock(x, y, s, c) { box(x - s * 0.32, y - s * 0.05, s * 0.64, s * 0.48, s * 0.08, c);
    ctx.beginPath(); ctx.arc(x, y - s * 0.08, s * 0.2, Math.PI, 0); ctx.strokeStyle = c; ctx.lineWidth = s * 0.09; ctx.stroke(); },
  mail(x, y, s, c) { box(x - s / 2, y - s * 0.34, s, s * 0.68, s * 0.08, null, c, s * 0.08);
    ctx.beginPath(); ctx.moveTo(x - s / 2 + 4, y - s * 0.3); ctx.lineTo(x, y + s * 0.06); ctx.lineTo(x + s / 2 - 4, y - s * 0.3); ctx.strokeStyle = c; ctx.lineWidth = s * 0.08; ctx.stroke(); },
  gear(x, y, s, c) { ctx.save(); ctx.translate(x, y); ctx.fillStyle = c;
    for (let i = 0; i < 8; i++) { ctx.rotate(Math.PI / 4); ctx.fillRect(-s * 0.08, -s * 0.5, s * 0.16, s * 0.24); }
    ctx.beginPath(); ctx.arc(0, 0, s * 0.33, 0, 7); ctx.fill(); dot(0, 0, s * 0.13, '#fff'); ctx.restore(); },
  file(x, y, s, c) { ctx.beginPath(); ctx.moveTo(x - s * 0.34, y - s * 0.46); ctx.lineTo(x + s * 0.14, y - s * 0.46); ctx.lineTo(x + s * 0.34, y - s * 0.26);
    ctx.lineTo(x + s * 0.34, y + s * 0.46); ctx.lineTo(x - s * 0.34, y + s * 0.46); ctx.closePath(); ctx.strokeStyle = c; ctx.lineWidth = s * 0.08; ctx.lineJoin = 'round'; ctx.stroke();
    for (let i = 0; i < 3; i++) line(x - s * 0.18, y - s * 0.1 + i * s * 0.17, x + s * 0.18, y - s * 0.1 + i * s * 0.17, c, s * 0.07); },
  plus(x, y, s, c) { line(x - s * 0.3, y, x + s * 0.3, y, c, s * 0.12); line(x, y - s * 0.3, x, y + s * 0.3, c, s * 0.12); },
  back(x, y, s, c) { ctx.beginPath(); ctx.arc(x + s * 0.05, y + s * 0.05, s * 0.3, -Math.PI * 0.5, Math.PI * 0.6); ctx.strokeStyle = c; ctx.lineWidth = s * 0.1; ctx.lineCap = 'round'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - s * 0.2, y - s * 0.25); ctx.lineTo(x + s * 0.08, y - s * 0.42); ctx.lineTo(x + s * 0.08, y - s * 0.08); ctx.closePath(); ctx.fillStyle = c; ctx.fill(); },
  down(x, y, s, c) { line(x, y - s * 0.36, x, y + s * 0.16, c, s * 0.1); ctx.beginPath(); ctx.moveTo(x - s * 0.22, y); ctx.lineTo(x, y + s * 0.24); ctx.lineTo(x + s * 0.22, y);
    ctx.strokeStyle = c; ctx.lineWidth = s * 0.1; ctx.lineJoin = 'round'; ctx.stroke(); line(x - s * 0.34, y + s * 0.4, x + s * 0.34, y + s * 0.4, c, s * 0.1); },
  qr(x, y, s, c) { const m = s / 7; ctx.fillStyle = c;
    for (const [cx, cy] of [[0, 0], [4, 0], [0, 4]]) { ctx.fillRect(x - s / 2 + cx * m, y - s / 2 + cy * m, 3 * m, 3 * m); ctx.fillStyle = '#fff'; ctx.fillRect(x - s / 2 + (cx + 0.75) * m, y - s / 2 + (cy + 0.75) * m, 1.5 * m, 1.5 * m); ctx.fillStyle = c; }
    for (let i = 0; i < 12; i++) { const a = Math.floor((i * 7 + 3) % 4) + 3, b = Math.floor((i * 5 + 1) % 7); if (a > 3 || b > 3) ctx.fillRect(x - s / 2 + a * m, y - s / 2 + b * m, m, m); } },
  globe(x, y, s, c) { ctx.beginPath(); ctx.arc(x, y, s * 0.44, 0, 7); ctx.strokeStyle = c; ctx.lineWidth = s * 0.08; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x, y, s * 0.18, s * 0.44, 0, 0, 7); ctx.stroke(); line(x - s * 0.44, y, x + s * 0.44, y, c, s * 0.07); },
};

const IMG = {};
function logo(cx, cy, h) { const im = IMG.logo, w = h * im.width / im.height; ctx.drawImage(im, cx - w / 2, cy - h / 2, w, h); }

// ---- the locked header: a numbered kicker over a 72 px title ----------------------------------
function header(kicker, title, o = {}) {
  const { c = C.blue, at = -0.3 } = o;   // the title is already rising as the wipe passes
  alpha(fade(at, at + 0.4), () => label(kicker, MX, 128, 26, { w: 800, c, ls: '3px' }));
  rise(title, MX, 212, 72, { w: 800, at: at + 0.1 });
}

// ---- the workflow rail: eight steps along the bottom, the film's spine ---------------------------
const STEPS = ['Set up', 'Apply', 'Approve', 'Link', 'Register', 'Sync', 'Exit', 'Manage'];
const STEP_AT = [['admin', 0], ['apply', 1], ['buy', 2], ['link', 3], ['register', 4], ['sync', 5], ['exit', 6], ['after', 7]];
function rail(T) {
  const show = outExpo(prog(T, SC.admin - 1.6, SC.admin - 0.6)) * (1 - inOutCubic(prog(T, SC.end - SEAM, SC.end + SEAM * 0.5)));
  if (show <= 0) return;
  let P = -1;                                            // the active step, eased across each cut
  for (const [k, i] of STEP_AT) if (T >= SC[k] - 0.2) P = i - 1 + outExpo(prog(T, SC[k] - 0.2, SC[k] + 0.6));
  const review = inOutCubic(prog(T, SC.why - 0.2, SC.why + 0.9));              // the rail rises for the benefits
  const cy = lerp(985, 380, review), x0 = lerp(300, 260, review), x1 = lerp(1620, 1660, review), r = lerp(16, 24, review);
  const ly = cy + lerp(56, 66, review), lsz = lerp(26, 30, review);
  const nx = i => lerp(x0, x1, i / 7);
  ctx.save(); ctx.globalAlpha = show;
  const grow = outExpo(prog(T, SC.admin - 1.6, SC.admin - 0.4));
  line(x0, cy, lerp(x0, x1, grow), cy, C.line, 6);
  if (P >= 0) line(x0, cy, nx(Math.min(P, 7)), cy, C.blue, 6);
  STEPS.forEach((name, i) => {
    const s = spring(T - (SC.admin - 1.5 + i * 0.08), ...POP); if (s <= 0) return;
    const done = P >= i - 0.5, active = Math.abs(P - i) < 0.5 && review < 0.5;
    const fill = done ? C.blue : C.card;
    const rad = r * s * (active ? 1.25 : 1);
    if (active) { const b = ((T % BEAT) + BEAT) % BEAT; dot(nx(i), cy, rad + 10 + 6 * Math.exp(-b * 6), 'rgba(29,95,209,.14)'); }
    dot(nx(i), cy, rad, fill);
    if (!done) { ctx.beginPath(); ctx.arc(nx(i), cy, rad, 0, 7); ctx.strokeStyle = C.grey; ctx.lineWidth = 3; ctx.stroke(); }
    label(String(i + 1), nx(i), cy + rad * 0.36, rad * 1.0, { w: 800, c: done ? '#fff' : C.muted, align: 'center' });
    label(name, nx(i), ly, lsz, { w: active || review > 0.5 ? 800 : 600, c: active || review > 0.5 ? C.navy : C.muted, align: 'center' });
  });
  ctx.restore();
}

// ---- scenes -----------------------------------------------------------------------------
// 0 · what DigiPass is
const TRAY_A = [1040, 430], TRAY_B = [210, 430], TRAY_W = 640, TRAY_H = 400;
const TRAY_SLOT = i => [72 + (i % 4) * 166, 140 + Math.floor(i / 4) * 86];     // ticket centres inside the tray
const LANES = [560, 700, 840], CAR_X = 1330, CAR_W = 230;
function sOpen() {
  // the title, then one line under it that changes with the narration
  const up = inOutCubic(prog(t, L('season') - 0.9, L('season') - 0.1));

// 9 · what the client's team gets
const GAINS = [['link', 'No app to install', [3, 4]], ['qr', 'No QR code at the gate', [6]], ['person', 'Guests register themselves', [4]],
               ['coin', 'Prepaid, in one pool', [2]], ['ticket', 'One ticket per exit', [6]], ['file', 'Every use on record', [7]]];
const NODE_X = n => lerp(260, 1660, n / 7), NODE_Y = 380;            // the risen rail's nodes
function sWhy() {
  header('WHY DIGIPASS', 'Simpler for guests, clearer for your team');
  const landed = i => t >= L('cards', i) + 0.55;
  GAINS.map((g, i) => [g, i]).sort(([, a], [, b]) => landed(a) - landed(b)).forEach(([[ic, s, steps], i]) => {
    const x = 150 + (i % 3) * 547, y = 600 + Math.floor(i / 3) * 170, at = L('cards', i);
    const g = outCubic(prog(t, -0.2 + i * 0.05, 0.3 + i * 0.05)), p = outCubic(prog(t, at, at + 0.55));
    if (g > 0 && p < 1) alpha(g * (1 - p), () => { ctx.setLineDash([10, 8]); box(x, y, 510, 140, 22, null, C.blueLine, 2); ctx.setLineDash([]); });
    steps.forEach(n => { const r = prog(t, at, at + 0.7);              // the step that delivers it pulses
      if (r > 0 && r < 1) { ctx.beginPath(); ctx.arc(NODE_X(n), NODE_Y, 26 + 36 * r, 0, 7); ctx.strokeStyle = `rgba(29,95,209,${1 - r})`; ctx.lineWidth = 4; ctx.stroke(); } });
    if (p <= 0) return;
    const sx = steps.reduce((a, n) => a + NODE_X(n), 0) / steps.length;
    ctx.save(); ctx.translate(lerp(sx, x + 255, p), lerp(NODE_Y, y + 70, p)); ctx.scale(lerp(0.15, 1, p), lerp(0.15, 1, p)); ctx.translate(-(x + 255), -(y + 70));
    ctx.globalAlpha *= clamp(p * 2);
    box(x, y, 510, 140, 22, C.blueBg, C.blueLine, 2);
    dot(x + 60, y + 70, 36, C.card);
    if (ic === 'ticket') ticket(x + 60, y + 70, 56, 30); else ICON[ic](x + 60, y + 70, 38, C.blue);
    const tag = steps.length > 1 ? `STEPS ${steps[0] + 1}\u2013${steps[steps.length - 1] + 1}` : `STEP ${steps[0] + 1}`;
    label(tag, x + 112, y + 54, 26, { w: 800, c: C.blue, ls: '2px' });
    label(s, x + 112, y + 98, 28, { w: 800, c: C.navy });
    ctx.restore();
  });
}

// 10 · end
function sEnd() {
  const tk = pop(-0.6);
  if (tk > 0) ticket(W / 2, 330, 220, 112, { s: tk, state: t > L('final') ? 'green' : 'blue' });
  rise('Re Sustainability DigiPass', W / 2, 540, 104, { w: 800, align: 'center', at: -0.2 });
  const tags = ['Buy once', 'Share a link', 'One ticket per exit'], pw = tags.map(s => width(s, 36, 700) + 36 * 1.4), gap = 40;
  let x = W / 2 - (pw.reduce((a, b) => a + b, 0) + gap * 2) / 2;
  tags.forEach((s, i) => { pill(s, x + pw[i] / 2, 650, i === 2 ? C.green : C.blue, i === 2 ? C.greenBg : C.blueBg, pop(L('tag', i)), 36); x += pw[i] + gap; });
  alpha(fade(1.0, 1.6), () => {
    logo(W / 2, 810, 70);
    label('Prepared for Mount Alvernia Hospital \u00b7 October 2026', W / 2, 920, 28, { w: 700, c: C.navy, align: 'center' });
    label('Example values are illustrative \u00b7 Narration voice is AI-generated', W / 2, 990, 22, { w: 500, c: C.muted, align: 'center' });
  });
}

// ---- compositor -----------------------------------------------------------------------------
const SCENES = [['open', sOpen], ['admin', sAdmin], ['apply', sApply], ['buy', sBuy], ['link', sLink], ['register', sRegister],
                ['sync', sSync], ['exit', sExit], ['choice', sChoice], ['after', sAfter], ['why', sWhy], ['end', sEnd]]
  .map(([k, draw]) => ({ t0: SC[k], draw }));
const SEAMS = SCENES.slice(1).map((s, k) => (k === SCENES.length - 2 ? { type: 'iris', at: [W / 2, 330] } : { type: 'wipe' }));
const far = (x, y) => Math.hypot(Math.max(x, W - x), Math.max(y, H - y)) * 1.04;

function drawScene(i, T) {
  T0 = SCENES[i].t0; t = T - T0;
  ctx.save(); bg(); SCENES[i].draw(); ctx.restore();
}
function transition(k, T) {
  const s = SEAMS[k], cut = SCENES[k + 1].t0;
  const u = prog(T, cut - SEAM, cut + SEAM), e = inOutExpo(u);
  const A = () => drawScene(k, T), B = () => drawScene(k + 1, T);
  if (s.type === 'wipe') {
    A();
    // a slanted blue band sweeps left to right; the next scene is already behind it
    const slant = 420, band = 110, xc = lerp(-slant - band, W + slant + band, e);
    const xt = xc + slant / 2 - band / 2, xb = xc - slant / 2 - band / 2;
    ctx.save(); ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(xt, -10); ctx.lineTo(xb, H + 10); ctx.lineTo(-10, H + 10); ctx.closePath();
    ctx.clip(); B(); ctx.restore();
    if (u > 0 && u < 1) { ctx.beginPath(); ctx.moveTo(xt, -10); ctx.lineTo(xt + band, -10); ctx.lineTo(xb + band, H + 10); ctx.lineTo(xb, H + 10); ctx.closePath();
      ctx.fillStyle = C.blue; ctx.fill(); }
  } else {
    A();
    const [x, y] = s.at, r = e * far(x, y);
    if (r > 0) {
      ctx.save(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.clip(); B(); ctx.restore();
      if (u < 1) { ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.strokeStyle = C.blue; ctx.lineWidth = 8; ctx.stroke(); }
    }
  }
}
function render(T) {
  T = clamp(T, 0, DURATION);
  ctx.reset();                                          // nothing carries over from the previous frame
  bg();
  let done = false;
  for (let k = 0; k < SEAMS.length && !done; k++) {
    const cut = SCENES[k + 1].t0;
    if (T >= cut - SEAM && T < cut + SEAM) { transition(k, T); done = true; }
  }
  if (!done) { let i = SCENES.length - 1; while (i > 0 && T < SCENES[i].t0) i--; drawScene(i, T); }
  rail(T);                                              // the spine stays put across every cut
}

// ---- events: the cuts, for render.mjs --check (the score is composed from timeline.json by music.py)
const EVENTS = { bpm: TL.bpm, duration: DURATION, cuts: SCENES.slice(1).map((s, k) => [s.t0, SEAMS[k].type]) };

// ---- boot -------------------------------------------------------------------------------
window.DURATION = DURATION;
window.EVENTS = EVENTS;
window.seek = async T => render(T);
(async () => {
  IMG.logo = new Image(); IMG.logo.src = 'data:image/png;base64,__ASSET:assets/re-logo.png__'; await IMG.logo.decode();
  await Promise.all([500, 600, 700, 800, 900].map(w => document.fonts.load(`${w} 40px ${FONT}`)));
  const q = new URLSearchParams(location.search).get('t');
  render(q ? +q : 0);
  window.READY = true;
  if (location.hash === '#play') {                       // preview only
    const t0 = performance.now();
    const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
    loop();
  }
})();
</script>
