<!doctype html>
<html><head><meta charset="utf-8"><title>Look Up</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas width="1920" height="1080"></canvas>
<script>
// "Look Up": a promo film of Galaxy Explorer, edited from footage captured frame by frame (capture.mjs).
// Frame contract: window.DURATION (seconds) and async window.seek(t); every value is a pure function of t.
const TL = JSON.parse(__TEXT:timeline.json__), CUE = TL.cue, SC = TL.scenes;
const W = 1920, H = 1080, DURATION = TL.duration, BAR_H = 138, FPS = 60;
const INK = '#f3efe6', GOLD = '#ffd45a';
const TITLE = '"Helvetica Neue", Helvetica, Arial, sans-serif', ZH = '"PingFang SC", "Hiragino Sans GB", sans-serif', MONO = 'Menlo, monospace';
const cv = document.querySelector('canvas'), ctx = cv.getContext('2d');

// ---- time helpers --------------------------------------------------------------------------------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => x * x * (3 - 2 * x);
const easeIO = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const window01 = (t, a, b, fin = 0.4, fout = 0.4) => ease(ramp(t, a, a + fin)) * (1 - ease(ramp(t, b - fout, b)));
const lerp = (a, b, k) => a + (b - a) * k;

// ---- footage -------------------------------------------------------------------------------------------
const cache = new Map();
function img(src) {                                    // a few decoded frames; 4K frames are 33 MB each
  if (!cache.has(src)) {
    const im = new Image(); im.src = src;
    cache.set(src, im.decode().then(() => im));
    while (cache.size > 6) cache.delete(cache.keys().next().value);
  }
  return cache.get(src);
}
const shotsAt = t => { const on = TL.reel.filter(r => t >= r.t0 && t < r.t1); return on.length ? on : [TL.reel[TL.reel.length - 1]]; };
const shotAt = t => shotsAt(t).at(-1);                 // the newest shot on screen (two overlap only in a crossfade)
function footFrame(r, t) {                             // the (fractional) footage frame at t
  if (r.warp) {                                        // warp: [film time, frame] keys, piecewise linear, rate 1 after the last
    const w = r.warp, i = w.findLastIndex(k => k[0] <= t);
    if (i < 0) return w[0][1] + (t - w[0][0]) * FPS;
    if (i === w.length - 1) return w[i][1] + (t - w[i][0]) * FPS;
    return lerp(w[i][1], w[i + 1][1], (t - w[i][0]) / (w[i + 1][0] - w[i][0]));
  }
  const u = t - r.t0, [r0, r1] = Array.isArray(r.rate) ? r.rate : [r.rate, r.rate];   // a rate pair ramps linearly
  return r.in + FPS * (r0 * u + (r1 - r0) * u * u / (2 * (r.t1 - r.t0)));
}
const frameOf = (r, t) => clamp(Math.floor(footFrame(r, t) + 1e-6), 0, r.frames - 1);
const footage = (r, t) => img(`../../out/galaxy-look-up/shots/${r.shot}/${String(frameOf(r, t)).padStart(5, '0')}.jpg`);
function zoomOf(r, t) {                               // zoom[0] to zoom[1] across the shot (or across r.zt); snap: a kick on the cut
  const [a, b] = r.zt || [r.t0, r.t1];
  return lerp(r.zoom[0], r.zoom[1], r.zt ? easeIO(ramp(t, a, b)) : ramp(t, a, b)) * (r.snap ? 1 + 0.08 * Math.exp(-(t - r.t0) / 0.12) : 1);
}
function cropOf(r, t, iw, ih) {                        // the source rectangle of the footage frame that fills the picture
  const z = zoomOf(r, t), sw = iw / z, sh = ih / z;
  return [clamp(r.c[0] * iw - sw / 2, 0, iw - sw), clamp(r.c[1] * ih - sh / 2, 0, ih - sh), sw, sh, z];
}
function drawFootage(im, r, t, dx, dy, dw, dh) {
  const [sx, sy, sw, sh] = cropOf(r, t, im.naturalWidth, im.naturalHeight);
  if (r.grade === 'dim') ctx.filter = 'brightness(0.9)';   // pulls a clipped highlight off flat white
  ctx.drawImage(im, sx, sy, sw, sh, dx, dy, dw, dh);
  ctx.filter = 'none';
}

// ---- type ----------------------------------------------------------------------------------------------
function text(s, x, y, { size = 40, weight = 200, font = TITLE, color = INK, alpha = 1, track = 0, align = 'center', blur = 0 } = {}) {
  if (alpha <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = alpha; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.font = `${weight} ${size}px ${font}`; ctx.letterSpacing = `${track}em`;
  if (blur) { ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = blur; }
  // letterSpacing adds space after the last glyph too; shift centred text back by half of it
  ctx.fillText(s, x + (align === 'center' ? track * size / 2 : 0), y);
  ctx.restore();
}
const LABELS = {
  earthg: ['EARTH', '地球'], moon: ['THE MOON', '月球'], sunwide: ['THE SUN', '太阳'], jupiter: ['JUPITER', '木星'],
  saturn: ['SATURN', '土星', 'right'], riseg: ['THE MILKY WAY', '银河系'],
  lmc: ['LARGE MAGELLANIC CLOUD', '大麦哲伦云'], cena: ['CENTAURUS A', '半人马座 A'], m87: ['M87', '室女座 A'],
};
const WHISPERS = [                                     // small facts, only ones the product's code shows; [from, to] after a scene starts
  ['sky', 0.6, 9.4, '25 constellations · real J2000 star positions'],
  ['burst', 5.4, 13.2, '85,000 points of light · generated in code'],
];

// ---- the frame -----------------------------------------------------------------------------------------
async function render(t) {
  const on = shotsAt(t), r = on.at(-1), ims = await Promise.all(on.map(x => footage(x, t)));
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.imageSmoothingQuality = 'high';                  // every frame starts from the same state
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  // the twist: from CUE.twist the picture shrinks into a browser window (2.5 s), and moves up for the end card
  const k = easeIO(ramp(t, CUE.twist, CUE.twist + 2.5)), u = easeIO(ramp(t, CUE.url - 0.2, CUE.url + 0.9));
  const bars = BAR_H * (1 - k);
  const scale = lerp(1 - 0.26 * k, 0.6, u), ww = W * scale, wh = H * scale, wx = (W - ww) / 2, wy = lerp(H / 2 - 20 * k, 465, u) - wh / 2;

  if (t >= CUE.look && t < SC.sky) {                 // the hook card: black, "Look up."
    text('Look up.', W / 2, H / 2, { size: 88, weight: 100, track: 0.3, alpha: window01(t, CUE.look + 0.3, SC.sky - 0.1, 0.6, 0.35) });
  } else if (k <= 0) {
    drawFootage(ims[0], on[0], t, 0, 0, W, H);
    if (on[0].grade === 'dither') dither(t);
    vignette(0.55);
  } else {
    desk(k);
    const top = 44 * k;
    ctx.save();
    shadow(wx, wy - top, ww, wh + top, k); roundClip(wx, wy - top, ww, wh + top, 14 * k);
    drawFootage(ims[0], on[0], t, wx, wy, ww, wh);
    if (on[1]) { ctx.globalAlpha = ease(ramp(t, on[1].t0, on[0].t1)); drawFootage(ims[1], on[1], t, wx, wy, ww, wh); ctx.globalAlpha = 1; }
    chrome(wx, wy - top, ww, top, k);
    ctx.restore();
    const ui = on.find(x => x.shot === 'ui');
    if (ui) cursor(t, ui, (fx, fy) => { const [sx, sy, sw, sh] = cropOf(ui, t, 1920, 1080); return [wx + (fx - sx) / sw * ww, wy + (fy - sy) / sh * wh]; });
  }

  // fade from black into the sky, and the white flash out of the wormhole
  if (t >= SC.sky && t < SC.sky + 0.9) { ctx.fillStyle = `rgba(0,0,0,${1 - ease(ramp(t, SC.sky, SC.sky + 0.9))})`; ctx.fillRect(0, 0, W, H); }
  flash(t);

  // place names inside the picture, above the lower bar
  const lab = LABELS[r.shot];
  if (lab && k <= 0) {
    const a = window01(t, r.t0 + 0.3, Math.min(r.t1, CUE.twist) - 0.1, 0.4, 0.3) * 0.9, [en, zh, side] = lab;
    ctx.save(); ctx.font = `300 26px ${TITLE}`; ctx.letterSpacing = '0.32em'; const enW = ctx.measureText(en).width; ctx.restore();
    ctx.save(); ctx.font = `300 26px ${ZH}`; ctx.letterSpacing = '0.18em'; const zhW = ctx.measureText(zh).width; ctx.restore();
    const x0 = side === 'right' ? W - 96 - zhW - 22 - enW : 96;
    text(en, x0, H - BAR_H - 58, { size: 26, weight: 300, track: 0.32, align: 'left', alpha: a, blur: 10 });
    text(zh, x0 + enW + 22, H - BAR_H - 58, { size: 26, weight: 300, font: ZH, track: 0.18, align: 'left', alpha: a * 0.9, blur: 10 });
  }

  // the letterbox; small facts sit in the top bar, subtitles in the lower one
  if (bars > 0.5) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, bars); ctx.fillRect(0, H - bars, W, bars); }
  for (const [scene, a, b, s] of WHISPERS) {
    const t0 = SC[scene];
    if (t > t0 + a && t < t0 + b) text(s, W - 96, BAR_H / 2, { size: 28, weight: 400, font: MONO, align: 'right', alpha: 0.75 * window01(t, t0 + a, t0 + b, 0.6, 0.6) });
  }
  for (const s of TL.subs) {                           // Chinese over English, both inside the lower bar
    if (t < s.t0 || t > s.t1) continue;
    const a = 0.92 * window01(t, s.t0, s.t1, 0.15, 0.2), two = !!s.en;
    text(s.zh, W / 2, H - BAR_H / 2 - (two ? 20 : 0), { size: 32, weight: 300, font: ZH, track: 0.06, alpha: a });
    if (two) text(s.en, W / 2, H - BAR_H / 2 + 24, { size: 26, weight: 300, track: 0.02, alpha: a * 0.85 });
  }

  // the end card: name and address below the window, then an iris
  const n = ramp(t, CUE.url + 0.3, CUE.url + 1.2);
  if (n > 0) {
    text('Galaxy Explorer', W / 2, 887, { size: 64, weight: 100, track: 0.28, alpha: ease(n) });
    text('zjoooooo.github.io/galaxy-explorer', W / 2, 965, { size: 32, weight: 300, track: 0.08, color: GOLD, alpha: ease(ramp(t, CUE.url + 0.7, CUE.url + 1.6)) });
    text('Narration: AI voice', W - 72, H - 44, { size: 26, weight: 300, align: 'right', alpha: 0.45 * ease(ramp(t, CUE.url + 1.5, CUE.url + 2.3)) });
  }
  iris(t, W / 2, wy + wh / 2);                         // it closes on the galaxy in the window
  grain(t);
}

function vignette(strength) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${strength})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function flash(t) {                                    // out of the wormhole: 3 frames up, 2 held, then an exponential fall
  const b = CUE.burst, a = t < b ? ramp(t, b - 0.05, b) : t < b + 0.033 ? 1 : Math.exp(-(t - b - 0.033) / 0.16);
  if (a < 0.004) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = `rgba(255,255,255,${a})`; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.6);
  g.addColorStop(0, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
function dither(t, a = 0.02) {                         // extra noise where smooth glows band under 8-bit capture and H.264
  const f = Math.floor(t * 24);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a;
  ctx.translate(-((f * 53) % 256), -((f * 89) % 256)); ctx.fillStyle = ctx.createPattern(GRAIN, 'repeat'); ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
}
const GRAIN = (() => {                                 // seeded noise tile; moved every 1/24 s it reads as film grain and dithers gradients
  const c = Object.assign(document.createElement('canvas'), { width: 256, height: 256 }), g = c.getContext('2d'), d = g.createImageData(256, 256);
  let s = 20261014;
  for (let i = 0; i < d.data.length; i += 4) { s = (s * 1664525 + 1013904223) >>> 0; const v = s >>> 24; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c;
})();
function grain(t) {
  const f = Math.floor(t * 24), ox = (f * 97) % 256, oy = (f * 61) % 256;
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.06;
  ctx.translate(-ox, -oy); ctx.fillStyle = ctx.createPattern(GRAIN, 'repeat'); ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
}
function desk(k) {                                     // the dark around the window
  const g = ctx.createRadialGradient(W / 2, H * 0.42, 80, W / 2, H * 0.5, W * 0.7);
  g.addColorStop(0, `rgba(22,26,44,${k})`); g.addColorStop(1, `rgba(4,5,9,${k})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function roundClip(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.clip(); }
function shadow(x, y, w, h, k) {
  ctx.save(); ctx.shadowColor = `rgba(0,0,0,${0.7 * k})`; ctx.shadowBlur = 60; ctx.shadowOffsetY = 18;
  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 14 * k); ctx.fill(); ctx.restore();
}
function chrome(x, y, w, h, k) {                       // a plain browser bar: three dots and the real address
  ctx.save(); ctx.globalAlpha = k;
  ctx.fillStyle = '#1b1d24'; ctx.fillRect(x, y, w, h);
  ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => { ctx.fillStyle = c; ctx.globalAlpha = k * 0.85; ctx.beginPath(); ctx.arc(x + 24 + i * 22, y + h / 2, 6.5, 0, Math.PI * 2); ctx.fill(); });
  if (h > 24) { ctx.globalAlpha = k; ctx.fillStyle = '#2a2d36'; ctx.beginPath(); ctx.roundRect(x + w * 0.27, y + 8, w * 0.46, h - 16, (h - 16) / 2); ctx.fill(); }
  ctx.restore();
  if (h > 24) text('zjoooooo.github.io/galaxy-explorer', x + w / 2, y + h / 2 + 1, { size: 26, weight: 400, color: '#c9ccd6', alpha: k });
}
function cursor(t, r, toScreen) {                     // the pointer the ui shot recorded: drift, release, the button, the drag
  const M = r.marks, f = footFrame(r, t), drift = x => [700 + x * 0.5, 540];
  const end = [M.from[0] + M.by[0], M.from[1] + M.by[1]];
  const a = window01(f, r.in, M.drag[1] + 60, 20, 30);
  if (a <= 0) return;
  let p, down = false;
  if (f < M.release) { p = drift(f); down = true; }
  else if (f < M.click - 5) { const q = easeIO(ramp(f, M.release, M.click - 5)); p = [lerp(drift(M.release)[0], M.button[0], q), lerp(540, M.button[1] + 6, q)]; }
  else if (f < M.click + 20) { p = [M.button[0], M.button[1] + 6]; down = f >= M.click - 2 && f < M.click + 4; }
  else if (f < M.drag[0]) { const q = easeIO(ramp(f, M.click + 20, M.drag[0] - 10)); p = [lerp(M.button[0], M.from[0], q), lerp(M.button[1] + 6, M.from[1], q)]; }
  else if (f <= M.drag[1]) { const q = ramp(f, M.drag[0], M.drag[1]); p = [lerp(M.from[0], end[0], q), lerp(M.from[1], end[1], q)]; down = true; }
  else p = end;
  const [x, y] = toScreen(...p), z = down ? 0.9 : 1;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y); ctx.scale(1.25 * z, 1.25 * z);
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 21); ctx.lineTo(5, 16.5); ctx.lineTo(8.5, 24); ctx.lineTo(11.5, 22.6); ctx.lineTo(8, 15.4); ctx.lineTo(14.5, 15.4); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#111'; ctx.lineWidth = 1.3; ctx.fill(); ctx.stroke();
  ctx.restore();
}
function iris(t, cx, cy) {
  const q = easeIO(ramp(t, DURATION - 1.6, DURATION - 0.1));
  if (q <= 0) return;
  const R = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)) * (1 - q);
  ctx.save(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(cx, cy, Math.max(0, R), 0, Math.PI * 2, true); ctx.fill('evenodd'); ctx.restore();
}

window.DURATION = DURATION;
window.EVENTS = { bpm: TL.bpm, duration: DURATION, cuts: TL.reel.slice(1).map(r => r.t0) };
window.seek = async t => render(clamp(t, 0, DURATION - 1e-6));
Promise.all([`100 88px ${TITLE}`, `300 34px ${ZH}`, `400 28px ${MONO}`].map(f => document.fonts.load(f))).then(() => {
  // a gradient changes how Chrome rasterises later blended draws on this canvas, so draw one before any frame:
  // then a frame looks the same whether it is a page's first or follows others (render.mjs --check)
  vignette(0.5); grain(0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  window.READY = true;
});
if (!/[?&]norun/.test(location.search) && !navigator.webdriver) {   // opened by hand: play it
  const t0 = performance.now();
  const loop = async () => { await render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body></html>
